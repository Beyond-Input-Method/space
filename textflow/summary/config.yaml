gateway:
  defaultGatewayId: "deepseek_main"
  gateways:
    deepseek_main:
      providerType: "deepseek"
      baseUrl: "https://api.deepseek.com"
      apiKey: "sk-your-api-key-here"
      modelFast: "deepseek-chat"
      modelBalanced: "deepseek-chat"
      modelQuality: "deepseek-chat"
      enableStructuredOutput: true
      enableStream: false
      enableDeepThinking: false

pipeline:
  pipelines:
    - pipelineId: "summary"
      mode: "quality"
      totalTimeoutMs: 5000
      pipelineFailureStrategy: "use_original"
      steps:
        - name: "summary"
          order: 1
          timeoutMs: 2500
          retryCount: 0
          enabled: true
  sceneMappings:
    "summary": "summary"
  sourceMappings:
    "summary": "summary"

user:
  enabledProcessors:
    - "summary"
  qualityMode: "quality"
