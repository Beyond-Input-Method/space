gateway:
  defaultGatewayId: "deepseek_main"
  gateways:
    deepseek_main:
      providerType: "deepseek"
      baseUrl: "https://api.deepseek.com"
      apiKey: "sk-your-api-key-here"
      modelFast: "deepseek-chat"
      modelBalanced: "deepseek-chat"
      modelQuality: "deepseek-chat"
      enableStructuredOutput: true
      enableStream: false
      enableDeepThinking: false

pipeline:
  pipelines:
    - pipelineId: "segmentation"
      mode: "balanced"
      totalTimeoutMs: 3000
      pipelineFailureStrategy: "use_original"
      steps:
        - name: "segmentation"
          order: 1
          timeoutMs: 1500
          retryCount: 0
          enabled: true
  sceneMappings:
    "segment": "segmentation"
  sourceMappings:
    "segment": "segmentation"

user:
  enabledProcessors:
    - "segmentation"
  qualityMode: "balanced"
