# 豆包语音识别配置文件
# Speech recognition configuration for VolcEngine

# 语音服务提供商
provider: volcengine

# 豆包语音应用密钥
# Application Key for VolcEngine
appKey: ''

# 豆包语音访问密钥
# Access Key for VolcEngine API
accessKey: ''

# ==================== 标点符号配置 ====================
# Punctuation Settings

# 是否启用标点符号功能
# true: 启用标点符号处理 / false: 不启用
enablePunc: true

# 标点符号模式
# Punctuation mode
# "1": 智能添加标点 - 自动识别语义添加合适标点
# "2": 空格代替标点 - 用空格代替所有标点符号
# "3": 句末不加标点 - 不在句末添加标点，保留其他位置标点
puncMode: "3"

# ==================== 口水词过滤配置 ====================
# Filler Words Filter Settings

# 是否启用口水词（语气词）过滤
# true: 自动去除语音中的语气词，如"嗯"、"啊"、"这个"、"那个"等
# false: 保留所有原始识别内容
enableFilterFiller: false

# ==================== 自动发送配置 ====================
# Auto Send Settings

# 是否启用语音自动发送功能
# true: 检测到触发短语时自动发送消息
# false: 关闭自动发送
enableAutoSend: true

# 自动发送触发短语
# 当语音识别到该短语时，自动触发发送操作
# 建议设置为不易与正常输入混淆的词组
triggerPhrase: "over,over"
