# 火山引擎语音识别配置文件
# Speech recognition configuration for VolcEngine

# 语音服务提供商
provider: volcengine

# 火山引擎应用密钥
# Application Key for VolcEngine
appKey: ''

# 火山引擎访问密钥
# Access Key for VolcEngine API
accessKey: ''

# 是否启用自动标点符号
# Enable automatic punctuation
# true: 自动添加标点符号 / false: 不添加标点符号
enablePunc: true

