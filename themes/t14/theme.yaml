# default settings
# encoding: utf-8

style:
  __include: ./../public/style/default:/style
preset_styles:
  __include: ./../public/preset_styles/default:/preset_styles
preset_candidates:
  __include: ./../public/preset_candidates/default:/preset_candidates
preset_fonts:
  __include: ./../public/preset_fonts/default:/preset_fonts
preset_color_schemes:
  __include: ./../public/preset_color_schemes/default:/preset_color_schemes
preset_keys:
  __include: ./../public/preset_keys/default:/preset_keys
preset_keyboards:
  __include: ./../public/preset_keyboards/default:/preset_keyboards
  # 其它键盘开启预览
  __patch:
    english/preview: true
    english_sm_md/preview: true
    half_symbols/preview: true
    symbols/preview: true
    symbols_sm_md/preview: true
  default:
    ascii_mode: 0
    height: 46
    width: 10
    height_land: 34
    horizontal_gap: 6
    vertical_gap: 10
    vertical_gap_land: 4
    round_corner: 6
    key_text_offset_x: 0
    key_text_offset_y: 5
    key_press_text_offset_x: 0
    key_press_text_offset_y: 0
    key_upper_press_text_offset_x: 0
    key_upper_press_text_offset_y: 0
    key_upper_text_offset_x: 0
    key_upper_text_offset_y: 5
    key_down_text_offset_x: 0
    key_down_text_offset_y: -1
    key_down_press_text_offset_x: 0
    key_down_press_text_offset_y: 0
    preview_round_corner: 9
    long_preview_round_corner: 9
    long_preview_padding: 0
    long_preview_margin: 4
    preview: false
    shadow: { radius: 0.1, offsetX: 0, offsetY: 1.2, color: "#90949C" }
    menu: { spacing: 28, first_scrollable: false, last_scrollable: false, events: [ eisu_toggle_setting, eisu_toggle_user_feedback, eisu_toggle_switch_setting, eisu_toggle_schema_setting, eisu_toggle_clip_board, eisu_toggle_search_clip_board, eisu_toggle_emoji, eisu_toggle_sound_board, eisu_toggle_haptics_board, eisu_toggle_dismiss_keyboard ] }
    #现在只支持配置click,swipe_up,swipe_down键盘
    keys:
    #1
    - { click: q, width: 20, label: 'QW', swipe_up: commit_1, long_click: [ commit_Q, commit_q, commit_1, commit_w, commit_W ] }
    - { click: e, width: 20, label: 'ER', swipe_up: commit_2, long_click: [ commit_E, commit_e, commit_2, commit_r, commit_R ] }
    - { click: t, width: 20, label: 'TY', swipe_up: commit_3, long_click: [ commit_T, commit_t, commit_3, commit_y, commit_Y ] }
    - { click: u, width: 20, label: 'UI', swipe_up: commit_4, long_click: [ commit_U, commit_u, commit_4, commit_i, commit_I ] }
    - { click: o, width: 20, label: 'OP', swipe_up: commit_5, long_click: [ commit_O, commit_o, commit_5, commit_p, commit_P ] }
    #2
    - { click: a, width: 20, label: 'AS', swipe_up: commit_6, long_click: [ commit_A, commit_a, commit_6, commit_s, commit_S ] }
    - { click: d, width: 20, label: 'DF', swipe_up: commit_7, long_click: [ commit_D, commit_d, commit_7, commit_f, commit_F ] }
    - { click: g, width: 20, label: 'GH', swipe_up: commit_8, long_click: [ commit_G, commit_g, commit_8, commit_h, commit_H ] }
    - { click: j, width: 20, label: 'JK', swipe_up: commit_9, long_click: [ commit_J, commit_j, commit_9, commit_k, commit_K ] }
    - { click: l, width: 20, label: 'L', swipe_up: commit_0, long_click: [ commit_l, commit_0, commit_L ] }
    #3
    - { click: participle, width: 15 }
    - { width: 1 }
    - { click: z, width: 17, label: 'ZX', swipe_up: commit_halfat, long_click: [ commit_Z, commit_z, commit_halfat, commit_x, commit_X ] }
    - { click: c, width: 17, label: 'CV', swipe_up: commit_fullquestionmark, swipe_down: commit_half_questionmark, long_click: [ commit_C, commit_c, commit_fullquestionmark, commit_v, commit_V ] }
    - { click: b, width: 17, label: 'BN', swipe_up: commit_fullcomma, swipe_down: commit_half_comma, long_click: [ commit_B, commit_b, commit_fullcomma, commit_n, commit_N ] }
    - { click: m, width: 17, label: 'M', swipe_up: commit_fulldot, swipe_down: commit_half_dot, long_click: [ commit_m, commit_fulldot, commit_M ] }
    - { width: 1 }
    - { click: backspace, width: 15, swipe_up: function_keyboard_clearAll, swipe_down: function_keyboard_undo, long_click: [function_keyboard_undo, function_keyboard_clearLeft, function_keyboard_clearRight, function_keyboard_clearAll, function_keyboard_redo]}
    #4
    - { click: eisu_toggle_符_symbols, width: 14, name: symbol, preview: false }
    - { click: eisu_toggle_123_number, has_menu: text_halfperiod, width: 13, name: number, preview: false }
    - { click: space, width: 38, name: space, swipe_up: select_second, preview: false }
    - { click: eisu_toggle_ABC_english, has_menu: text_halfcomma, width: 11, name: english, preview: false }
    - { click: return, width: 24, name: return, swipe_up: select_third, composing: confirm, long_click: next, rect_preview: true, preview: false }
