# default settings
# encoding: utf-8

style:
  __include: ./public/style/default:/style
preset_styles:
  __include: ./public/preset_styles/default:/preset_styles
preset_candidates:
  __include: ./public/preset_candidates/default:/preset_candidates
preset_fonts:
  __include: ./public/preset_fonts/default:/preset_fonts
preset_color_schemes:
  __include: ./public/preset_color_schemes/default:/preset_color_schemes
preset_keys:
  __include: ./public/preset_keys/default:/preset_keys

#键盘布局
preset_keyboards:
  default:
    ascii_mode: 0
    height_land: 34
    round_corner: 6
    key_text_offset_x: 0
    key_text_offset_y: 0
    key_press_text_offset_x: 0
    key_press_text_offset_y: 0
    key_upper_press_text_offset_x: 0
    key_upper_press_text_offset_y: 0
    key_upper_text_offset_x: 0
    key_upper_text_offset_y: 3
    preview_round_corner: 9
    long_preview_round_corner: 9
    long_preview_padding: 0
    long_preview_margin: 4
    shadow: { radius: 0.1, offsetX: 0, offsetY: 1.2, color: "#90949C" }

    menu: { events: [ text_fullperiod_default, text_fullquestionmark_default, text_fullpoint_default, text_halfellipsis_default, text_halfbracket_left_default, text_halfbracket_default, text_fullsemicolon_default, text_fulldun_default, text_fulltilde_default, text_fullcolon_default, text_fullsquarebracketleft2_left_default, text_fullsquarebracketright2_default, text_fullsmile_default, text_fullcomma2_default, text_halfpoundsign_default, text_halfcolon_default, "%", "-", "+", "×", "=" ] }
    horizontal_gap: 6
    vertical_gap: 10
    vertical_gap_land: 4
    name: number_keyboard
    preview: false
    height: 46
    width: 22
    keys:
    #1
    # - {width: 1}
    - { collection: [ "，", "。", "？", "！", "、", "；", "：", "@", "…", "~", "'" ], width: 17, height: 162, height_land: 111, row_height: 39, row_height_land: 35, row_vertical_gap: 3, show_row_back_image: false, name: table }
    - { click: 1, label: '分词', height: 50, swipe_up: commit_1, swipe_down: "一", long_click: [ commit_halfslash, commit_halfminus, commit_halfunderline, commit_1, commit_halfat, commit_halfpoundsign, commit_halfdot ] }
    - { click: a, label: 'ABC', height: 50, swipe_up: commit_2, swipe_down: "一", long_click: [ commit_a, commit_b, commit_c, commit_2, commit_A, commit_B, commit_C ] }
    - { click: d, label: 'DEF', swipe_up: commit_3, height: 50, long_click: [ commit_d, commit_e, commit_f, commit_3, commit_D, commit_E, commit_F ] }
    - { click: backspace, width: 17, height: 50, name: backspace }

    # # #2
    - { width: 17 }
    - { click: g, label: 'GHI', swipe_up: commit_4, height: 50, long_click: [ commit_g, commit_h, commit_i, commit_4, commit_G, commit_H, commit_I ] }
    - { click: j, label: 'JKL', swipe_up: commit_5, height: 50, long_click: [ commit_j, commit_k, commit_l, commit_5, commit_J, commit_K, commit_L ] }
    - { click: m, label: 'MNO', swipe_up: commit_6, height: 50, long_click: [ commit_m, commit_n, commit_o, commit_6, commit_M, commit_N, commit_O ] }
    - { click: function_rime_clear, width: 17, height: 50, name: dot }

    ## #3
    - { width: 17 }
    - { click: p, label: 'PQRS', swipe_up: commit_7, height: 50, long_click: [ commit_p, commit_q, commit_r, commit_s, commit_7, commit_P, commit_Q, commit_R, commit_S ] }
    - { click: t, label: 'TUV', swipe_up: commit_8, height: 50, long_click: [ commit_t, commit_u, commit_v, commit_8, commit_T, commit_U, commit_V ] }
    - { click: w, label: 'WXYZ', swipe_up: commit_9, height: 50, long_click: [ commit_w, commit_x, commit_y, commit_z, commit_9, commit_W, commit_X, commit_Y, commit_Z ] }
    - { click: return, name: return, width: 17, height: 102, height_land: 73, composing: confirm }
    ## #4
    - { click: eisu_toggle_符_dotsymbols, width: 17, height: 46, name: default }
    - { click: eisu_toggle_123_number, width: 12, height: 46 }
    - { click: space, name: space, swipe_up: commit_0, width: 42, height: 46 }
