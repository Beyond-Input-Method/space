# default settings
# encoding: utf-8

preset_keys:
  #建议命名规则:
  #命令_label_**
  #如：
  #   eisu_toggle_123_number: 跳转到标题为123的number键盘
  #   mode_switch_cn_or_en: 切换中方或者英文
  #   text_delimiter: text组合命令
  #   text_fullquotationmark_left_default: text 组合命令，上屏全解符号并移动后再跳转到黑夜键盘

  #注：当然命令不是硬性规定。各位也可以自定义sw

  #打开设置
  #icon 目前只支持苹果内置的sf _sound_board,具体请搜索

  # 设置
  # 支持系统：鸿蒙，iOS
  eisu_toggle_setting: {
    icon: "gearshape.svg",
    label: "设置",
    send: Eisu_toggle,
    select: _setting_board,
    option: [
      eisu_toggle_schema_board,             # 键盘方案选择
      eisu_toggle_theme_list_board,         # 主题
      eisu_toggle_custom_phrase_board,      # 常用语
      eisu_toggle_patch_board,              # 补丁管理
      eisu_toggle_toolbar_customize,        # 定制工具栏
      eisu_toggle_clip_board,               # 剪切板
      eisu_toggle_speech_setting,           # 语音设置
      function_rime_deploy,                 # 重新部署Rime
      eisu_toggle_sound_board,              # 声音设置
      eisu_toggle_haptic_board,             # 触感设置
      eisu_toggle_edit_keyboard_board,      # 键盘布局调整
      eisu_toggle_one_hand_board,           # 单手模式
      eisu_toggle_common_setting_board,     # 通用设置
      eisu_toggle_status_bar_board,         # 状态栏
      eisu_toggle_font_board,               # 字体
      eisu_toggle_fuzzy_pinyin,             # 模糊拼音设置
#      eisu_toggle_cut_setting,             # 剪切板
#      eisu_toggle_search_clip_board,       # 剪切板搜索
      eisu_toggle_pasteboard_setting_board, # 剪切板设置
      eisu_toggle_pasteboard_favorite_board, # 收藏的剪切板项目
      eisu_toggle_file_manager,             # 文件管理器
#      eisu_toggle_open_web_browser,         # 打开网页浏览器
      # eisu_toggle_switch_setting,
      # eisu_toggle_schema_setting,
      # eisu_toggle_phrases_board,
#      eisu_toggle_haptics_board,            # 触觉反馈设置
      eisu_toggle_emoji,                    # 表情符号选择器
      eisu_toggle_patch_predict,            # 联想
#      eisu_toggle_dismiss_keyboard,         # 收起键盘
      # eisu_toggle_dismiss_menu,
      # eisu_toggle_switcher,
      # eisu_toggle_system_info_board,
      # eisu_toggle_user_feedback,
      # 文本编辑功能
#      function_keyboard_clearAll,           # 清空输入
#      function_keyboard_undo,               # 撤销
#      function_keyboard_clearLeft,          # 清除左侧
#      function_keyboard_clearRight,         # 清除右侧
#      function_keyboard_redo,               # 重做
#      function_keyboard_selectAll,          # 全选
#      function_keyboard_cut,                # 剪切
#      function_keyboard_copy,               # 复制
#      function_keyboard_paste,              # 粘贴
#      function_keyboard_newline,            # 换行

      # Rime输入法相关功能
      function_rime_deploy_schema,          # 重新部署当前方案
#      function_rime_switcher,               # 切换
#      function_rime_clear,                  # 重新输入
      function_common_open_host             # 打开主机应用
    ]
  }

  # 清除设置
  # 支持系统：鸿蒙，iOS
  eisu_toggle_clear_setting: {
    icon: "eraser_line.svg",
    label: "清除设置",
    send: Eisu_toggle,
    select: _setting_board,
    option: [
      function_keyboard_clearAll,
      function_keyboard_clearLeft,
      function_keyboard_clearRight,
      function_keyboard_undo,
      function_keyboard_redo,
      function_keyboard_deleteLeft,
      function_keyboard_deleteRight,
    ]
  }
  # 剪切设置
  # 支持系统：鸿蒙，iOS
  eisu_toggle_cut_setting: {
    icon: "cut.svg",
    label: "剪切设置",
    send: Eisu_toggle,
    select: _setting_board,
    option: [
      function_keyboard_selectAll,
      function_keyboard_cut,
      function_keyboard_copy,
      function_keyboard_paste,
      function_keyboard_newline,
    ]
  }

  # 语音设置
  # 支持系统：鸿蒙
  eisu_toggle_speech_setting: {
    icon: "mic_badge_gearshape.svg",
    label: "语音设置",
    send: Eisu_toggle,
    select: _setting_board,
    option: [
      eisu_toggle_speech_list_board,
      eisu_toggle_patch_speech_volcengine,
      eisu_toggle_patch_speech_setting,
    ]
  }

  # 清除设置
  # 支持系统：鸿蒙，iOS
  eisu_toggle_clear_quick_panel: {
    icon: "eraser_line.svg",
    label: "清除设置",
    send: Eisu_toggle,
    select: _quick_panel,
    option: [
      function_keyboard_clearAll,
      function_keyboard_clearLeft,
      function_keyboard_clearRight,
      function_keyboard_undo,
      function_keyboard_redo,
      function_keyboard_deleteLeft,
      function_keyboard_deleteRight,
    ]
  }
  # 剪切设置
  # 支持系统：鸿蒙，iOS
  eisu_toggle_cut_quick_panel: {
    icon: "cut.svg",
    label: "剪切设置",
    send: Eisu_toggle,
    select: _quick_panel,
    option: [
      function_keyboard_selectAll,
      function_keyboard_cut,
      function_keyboard_copy,
      function_keyboard_paste,
      function_keyboard_newline,
    ]
  }


  # 语音设置
  # 支持系统：鸿蒙
  eisu_toggle_patch_speech_setting: { icon: "gearshape.svg", label: "语音设置", send: Eisu_toggle, select: _patch_setting, option: [ "_speech_setting" ] }
  # 笔画过滤
  # 支持系统：鸿蒙
  eisu_toggle_patch_speech_volcengine: { icon: "key_circle_fill.svg", label: "豆包语音配置", send: Eisu_toggle, select: _patch_setting, option: [ "_speech_volcengine" ] }


  # 键盘选择
  # 支持系统：鸿蒙
  eisu_toggle_schema_board: { icon: "keyboard_badge_handwritten.svg", label: "键盘选择", send: Eisu_toggle, select: _schema_dir_board }
  # 声音
  # 支持系统：鸿蒙，iOS
  eisu_toggle_sound_board: { icon: "speaker_wave_3.svg", label: "声音", send: Eisu_toggle, select: _sound_board }

  # 触感
  # 支持系统：鸿蒙，iOS
  eisu_toggle_haptic_board: { icon: "a_4d_vibration.svg", label: "触感", send: Eisu_toggle, select: _haptic_board }

  # 主题
  # 支持系统：鸿蒙
  eisu_toggle_theme_list_board: { icon: "paintpalette.svg", label: "主题", send: Eisu_toggle, select: _theme_list_board }

  # 字体
  # 支持系统：鸿蒙
  eisu_toggle_font_board: { icon: "textformat.svg", label: "字体", send: Eisu_toggle, select: _font_board }

  # 键盘调节
  # 支持系统：鸿蒙
  eisu_toggle_edit_keyboard_board: { icon: "mobiledata.svg", label: "键盘调节", send: Eisu_toggle, select: _edit_keyboard_board }
  # 单手模式
  # 支持系统：鸿蒙
  eisu_toggle_one_hand_board: { icon: "onehand.svg", label: "单手模式", send: Eisu_toggle, select: _one_hand_board }
  # 设置
  # 支持系统：鸿蒙，iOS
  eisu_toggle_common_setting_board: { icon: "gearshape.svg", label: "设置", send: Eisu_toggle, select: _common_setting_board }
  # 状态栏
  # 支持系统：鸿蒙
  eisu_toggle_status_bar_board: { icon: "statusbar_cast.svg", label: "状态栏", send: Eisu_toggle, select: _status_bar_board }
  eisu_toggle_toolbar_customize: { icon: "list_square.svg", label: "定制工具栏", send: Eisu_toggle, select: _toolbar_customize }
  # 常用语
  # 支持系统：鸿蒙
  eisu_toggle_custom_phrase_board: { icon: "doc_text.svg", label: "常用语", send: Eisu_toggle, select: _custom_phrase_board }

  # 补丁
  # 支持系统：鸿蒙
  eisu_toggle_patch_board: { icon: "key_horizontal.svg", label: "补丁", send: Eisu_toggle, select: _patch_board }
  # 模糊拼音
  # 支持系统：鸿蒙
  eisu_toggle_fuzzy_pinyin: { icon: "flashlight_on.svg", label: "模糊拼音", send: Eisu_toggle, select: _patch_setting, option: ["fuzzy_pinyin"]}
  # 联想
  # 支持系统：鸿蒙
  eisu_toggle_patch_predict: { icon: "flashlight_on.svg", label: "联想", send: Eisu_toggle, select: _patch_setting, option: [ "predict" ] }
  # 候选栏配置
  # 支持系统：鸿蒙
  eisu_toggle_patch_candidate: { icon: "list_square.svg", label: "候选栏配置", send: Eisu_toggle, select: _patch_setting, option: [ "candidate" ] }
  # 字符过滤
  # 支持系统：鸿蒙
  eisu_toggle_patch_character_filter: { icon: "filter_color.svg", label: "字符过滤", send: Eisu_toggle, select: _patch_setting, option: [ "character_filter" ] }
  # 快速输出日期
  # 支持系统：鸿蒙
  eisu_toggle_patch_date: { icon: "calendar.svg", label: "快速输出日期", send: Eisu_toggle, select: _patch_setting, option: [ "date" ] }
  # 快速输出日期18键专用
  # 支持系统：鸿蒙
  eisu_toggle_patch_date_18: { icon: "calendar.svg", label: "快速输出日期18键专用", send: Eisu_toggle, select: _patch_setting, option: [ "date_18" ] }
  # 快速输出日期14键专用
  # 支持系统：鸿蒙
  eisu_toggle_patch_date_t14: { icon: "calendar.svg", label: "快速输出日期14键专用", send: Eisu_toggle, select: _patch_setting, option: [ "date_t14" ] }
  # 快速输出日期9键专用
  # 支持系统：鸿蒙
  eisu_toggle_patch_date_t9: { icon: "calendar.svg", label: "快速输出日期9键专用", send: Eisu_toggle, select: _patch_setting, option: [ "date_t9" ] }
  # 日期js版
  # 支持系统：鸿蒙
  eisu_toggle_patch_datejs: { icon: "calendar.svg", label: "日期js版", send: Eisu_toggle, select: _patch_setting, option: [ "datejs" ] }
  # 键盘配置
  # 支持系统：鸿蒙
  eisu_toggle_patch_keyboard: { icon: "keyboard_badge_gearshape.svg", label: "键盘配置", send: Eisu_toggle, select: _patch_setting, option: [ "keyboard" ] }
  # 大语言模型
  # 支持系统：鸿蒙
  eisu_toggle_patch_octagram: { icon: "AI.svg", label: "大语言模型", send: Eisu_toggle, select: _patch_setting, option: [ "octagram" ] }
  # 计算器
  # 支持系统：鸿蒙
  eisu_toggle_patch_calculator: { icon: "calculator.svg", label: "计算器", send: Eisu_toggle, select: _patch_setting, option: [ "calculator" ] }
  # 计算器JS版
  # 支持系统：鸿蒙
  eisu_toggle_patch_calculatorjs: { icon: "calculator.svg", label: "计算器js版", send: Eisu_toggle, select: _patch_setting, option: [ "calculatorjs" ] }
  # 笔画过滤
  # 支持系统：鸿蒙
  eisu_toggle_patch_stroke_filter: { icon: "keyboard_badge_bihua.svg", label: "笔画过滤", send: Eisu_toggle, select: _patch_setting, option: [ "stroke_filter" ] }


  # 剪切板
  # 支持系统：鸿蒙，iOS
  eisu_toggle_clip_board: { type: command, icon: "text_clipboard.svg", label: "剪切板", send: Eisu_toggle, select: _clip_board }
  #剪切板搜索
  # 支持系统：iOS
  eisu_toggle_search_clip_board: { icon: "doc_text_badge_magnifyingglass_mirroring.svg", label: "剪切板搜索", send: Eisu_toggle, select: _search_clip_board }
  # 剪切板设置
  # 支持系统：鸿蒙
  eisu_toggle_pasteboard_setting_board: { icon: "doc_plaintext_and_pencil.svg", label: "剪切板设置", send: Eisu_toggle, select: _pasteboard_setting_board }
  # 剪切板收藏
  # 支持系统：鸿蒙
  eisu_toggle_pasteboard_favorite_board: { icon: "star.svg", label: "剪切板收藏", send: Eisu_toggle, select: _pasteboard_favorite_board }

  # 文件管理器
  # 支持系统：鸿蒙Rime
  eisu_toggle_file_manager: { icon: "folder.svg", label: "文件管理", send: Eisu_toggle, select: _file_manager }
  # 浏览器
  # 支持系统：鸿蒙
  eisu_toggle_open_web_browser: { icon: "compass.svg", label: "浏览器", send: Eisu_toggle, select: _open_web_browser, option: ["https://www.bing.com"] }

  #开关设置
  # 支持系统：iOS
  eisu_toggle_switch_setting: { icon: "switch_square_lefthalf_filled.svg", label: "开关", send: Eisu_toggle, select: _setting, option: [ mode_switch_cn_or_en, mode_switch_pasteboard_monitoring_on_or_off, mode_switch_system_info_on_or_off ] }
  #方案的switch
  # 支持系统：iOS
  eisu_toggle_schema_setting: { icon: "slider_horizontal_2_square.svg", label: "设置", send: Eisu_toggle, select: _schema_setting }

  #常用语
  # 支持系统：iOS
  eisu_toggle_phrases_board: { icon: "doc_text.svg", label: " 常用语", send: Eisu_toggle, select: _phrases_board }

  #触感
  # 支持系统：鸿蒙，iOS
  eisu_toggle_haptics_board: { icon: "a_4d_vibration.svg", label: " 触感", send: Eisu_toggle, select: _haptics_board }
  #emoji
  # 支持系统：鸿蒙，iOS
  eisu_toggle_emoji: { type: command, icon: "face_laughing.svg", label: "emoji", send: Eisu_toggle, select: .emoji, option: [] }
  #收起键盘
  # 支持系统：鸿蒙，iOS
  eisu_toggle_dismiss_keyboard: { icon: "arrow_down_square.svg", label: "收起键盘", send: Eisu_toggle, select: _dismiss_keyboard, option: [] }
  #收起当前菜单
  # 支持系统：iOS
  eisu_toggle_dismiss_menu: { icon: "xmark_circle.svg", label: "收起当前菜单", send: Eisu_toggle, select: _dismiss_menu, option: [] }
  #切换命令
  # 支持系统：鸿蒙，iOS
  eisu_toggle_switcher: { icon: "arrow_2_circlepath.svg", label: "切换", send: F4 }
  #显示系统信息
  # 支持系统：iOS
  eisu_toggle_system_info_board: { icon: "info_circle.svg", label: "系统信息", send: Eisu_toggle, select: _system_info_board }
  #用户与反馈
  # 支持系统：iOS
  eisu_toggle_user_feedback: { icon: "reports.svg", label: "报Bug", send: Eisu_toggle, select: _user_feedback_board }

  #语音引擎
  # 支持系统：iOS
  eisu_toggle_speech_list_board: { icon: "mic_badge_gearshape.svg", label: "语音引擎", send: Eisu_toggle, select: _speech_list_board }



  #Mode_switch
  #开关
  #中英切换
  # 支持系统：iOS
  mode_switch_cn_or_en: { icon: "keyboard_badge_globe.svg", toggle: ascii_mode, send: Mode_switch, states: [ 中文, 西文 ], name: Mode_switch }
  #剪切板监控
  # 支持系统：iOS
  mode_switch_pasteboard_monitoring_on_or_off: { icon: "text_clipboard.svg", toggle: app_setting/pasteboard_monitoring_switch, send: Mode_switch, states: [ 剪切板监控关, 剪切板监控开 ], select: bim, name: Mode_switch }
  #启动显示系统信息
  # 支持系统：iOS
  mode_switch_system_info_on_or_off: { icon: "info_circle.svg", toggle: app_setting/show_system_info, send: Mode_switch, states: [ 系统信息关, 系统信息开 ], select: bim, name: Mode_switch }
  # （空行语义：与下方「基础导航 / Eisu_toggle」预设键分组分隔）
  # 基础编辑与导航（光标、修饰、回车、空格等）
  # 光标左移（Left）
  left: { icon: "arrow_left.svg", label: " ", send: Left }
  # 光标右移（Right）
  right: { icon: "arrow_right.svg", label: " ", send: Right }
# 光标左移（Left）
  left_arrow: { icon: "arrow_left.svg", label: "左", send: Left }
  # 光标右移（Right）
  right_arrow: { icon: "arrow_right.svg", label: "右", send: Right }

  # 左 Shift（Shift_L）
  shift: { icon: "arrow_up.svg", send: Shift_L }
  # 左 Shift 别名（Shift_L）
  shift_l: { icon: "arrow_up.svg", send: Shift_L }
  # 回车（Return）
  return: { icon: "return_down_left.svg", send: Return }
  # 确认（Return，展示「确认」）
  confirm: { icon: "checkmark.svg", send: Return, label: "确认", name: confirm }
  # 退格（BackSpace）
  backspace: { icon: "delete_left.svg", send: BackSpace }
  # 空格键（space）
  space: { icon: "space_1.svg", label: " ", send: space }
  # （分组间隔：基础导航 → 直接发送字符）
  # 直接发送键码/字符（数字、标点等，无图标或配合 textformat）
  # 发送数字 3
  send_3: { label: "", send: 3 }
  # 发送数字 2
  send_2: { label: "", send: 2 }
  # 发送句点「.」
  send_dot: { icon: "textformat.svg", label: ".", send: . }
  # 发送等号「=」
  send_equal: { icon: "textformat.svg",label: "=", send: "="}
  # 分词键（发送单引号）
  participle: { icon: "textformat.svg", label: 分词, send: "'" }
  # 发送分号「;」
  send_semicolon: { icon: "textformat.svg", label: ";", send: ";" }
  # （分组间隔：直接发送 → 候选与换行）
  # 候选栏：选择第 2 / 第 3 候选
  # 选择第二候选（send 2）
  select_second: { label: "次选", send: 2 }
  # 选择第三候选（send 3）
  select_third: { label: "三选", send: 3 }
  #日期
  rime_send_date: { label: "日期", text: "rq" }
  # 换行（上屏换行符，非 Return 键事件）
  # 上屏换行符 \n（commit）
  next: { icon: "return_down_left.svg", label: "换行", commit: "\\n" }
  # （分组间隔：候选/换行 → Eisu 方案切换）
  # Eisu_toggle + option:schema — 切换输入方案（如 easy_en / 恢复默认）
  # 切到 easy_en 方案（schema）
  eisu_toggle_schema_en: { icon: "textformat.svg", label: "ABC", send: Eisu_toggle, select: easy_en, option: schema }
  # 恢复默认方案（.default + schema）
  eisu_toggle_schema_default: { icon: "textformat.svg", label: "ABC", send: Eisu_toggle, select: .default, option: schema }
  # （分组间隔：schema → 键盘页切换）
  # Eisu_toggle — 切换键盘页/布局（number / english / symbols / default 等；.前缀 表示主题内默认页）
  # sm_md：小屏/中屏变体布局
  # 切到数字键盘页 number
  eisu_toggle_123_number: { label: 123, send: Eisu_toggle, select: number }
  eisu_toggle_number: { label: "数", send: Eisu_toggle, select: number }
  # 切到数字键盘页 number_sm_md（小/中屏）
  eisu_toggle_123_number_sm_md: { label: 123, send: Eisu_toggle, select: number_sm_md }
  # （分组间隔：数字页 → 英文页；下列两行为历史备选定义，已注释保留）
  #  eisu_toggle_ABC_english: {label: "ABC", send: Eisu_toggle, select: english}
  #  eisu_toggle_ABC_english: { label: "英", send: Eisu_toggle, select: english }
  # 切到英文键盘页 english（中/英）
  eisu_toggle_ABC_english: { icon: "keyboard_badge_globe.svg", label: "中/英", send: Eisu_toggle, select: english}
  # 切到英文页 english_sm_md（小/中屏）
  eisu_toggle_ABC_english_sm_md: { icon: "keyboard_badge_globe.svg", label: "中/英", send: Eisu_toggle, select: english_sm_md }
  # text 组合：同一键位叠加「切英文页 + 切方案」
  # 组合：english + easy_en 方案
  eisu_toggle_ABC_english_schema_easy_en: { icon: "keyboard_badge_globe.svg", label: "中/英", text: "{eisu_toggle_ABC_english}{eisu_toggle_schema_en}" }
  # 组合：english_sm_md + easy_en 方案
  eisu_toggle_ABC_english_sm_md_schema_easy_en: { icon: "keyboard_badge_globe.svg", label: "中/英", text: "{eisu_toggle_ABC_english_sm_md}{eisu_toggle_schema_en}" }
  # （分组间隔：英文组合键 → 符号页「符」）
  # 切到符号页 symbols（符）
  eisu_toggle_符_symbols: {label: "符", send: Eisu_toggle, select: symbols }
  # 音效面板等场景复用 symbols（符）
