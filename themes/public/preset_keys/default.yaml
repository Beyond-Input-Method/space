  #  •
  text_halfmiddledot_default: { label: "•", text: "•{eisu_toggle_default}" }
  # +
  text_halfplus_default: { label: "+", text: "+{eisu_toggle_default}" }
  # ×
  text_halfmultiplied_default: { label: "×", text: "×{eisu_toggle_default}" }
