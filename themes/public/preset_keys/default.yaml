# default settings
# encoding: utf-8

preset_keys:
  #建议命名规则:
  #命令_label_**
  #如：
  #   eisu_toggle_123_number: 跳转到标题为123的number键盘
  #   mode_switch_cn_or_en: 切换中方或者英文
  #   text_delimiter: text组合命令
  #   text_fullquotationmark_left_default: text 组合命令，上屏全解符号并移动后再跳转到黑夜键盘

  #注：当然命令不是硬性规定。各位也可以自定义

  #打开设置
  #icon 目前只支持苹果内置的sf symbols,具体请搜索

  #设置
  eisu_toggle_setting: { icon: "r.joystick.tilt.down.fill", label: "设置", send: Eisu_toggle, select: _setting, option: [ eisu_toggle_user_feedback, eisu_toggle_clip_board, eisu_toggle_phrases_board, eisu_toggle_search_clip_board, eisu_toggle_sound_board, eisu_toggle_haptics_board, eisu_toggle_emoji, eisu_toggle_switcher, eisu_toggle_system_info_board ] }
  #开关设置
  eisu_toggle_switch_setting: { icon: "switch.2", label: "开关", send: Eisu_toggle, select: _setting, option: [ mode_switch_cn_or_en, mode_switch_pasteboard_monitoring_on_or_off, mode_switch_system_info_on_or_off ] }
  #方案的switch
  eisu_toggle_schema_setting: { icon: "s.circle", label: "设置", send: Eisu_toggle, select: _schema_setting }
  #剪切板
  eisu_toggle_clip_board: { icon: "doc.plaintext", label: "剪切板", send: Eisu_toggle, select: _clip_board }
  #剪切板搜索
  eisu_toggle_search_clip_board: { icon: "doc.text.magnifyingglass", label: "剪切板搜索", send: Eisu_toggle, select: _search_clip_board }
  #常用语
  eisu_toggle_phrases_board: { icon: "doc.text", label: " 常用语", send: Eisu_toggle, select: _phrases_board }
  #声音
  eisu_toggle_sound_board: { icon: "speaker.wave.3", label: " 声音", send: Eisu_toggle, select: _sound_board }
  #触感
  eisu_toggle_haptics_board: { icon: "iphone.gen2.radiowaves.left.and.right", label: " 触感", send: Eisu_toggle, select: _haptics_board }
  #emoji
  eisu_toggle_emoji: { icon: "face.smiling", label: "emoji表情", send: Eisu_toggle, select: .emoji, option: [] }
  #收起键盘
  eisu_toggle_dismiss_keyboard: { icon: "chevron.down.square", label: "收起键盘", send: Eisu_toggle, select: _dismiss_keyboard, option: [] }
  #收起当前菜单
  eisu_toggle_dismiss_menu: { icon: "xmark.circle", label: "收起当前菜单", send: Eisu_toggle, select: _dismiss_menu, option: [] }
  #切换命令
  eisu_toggle_switcher: { icon: "switch.2", label: "切换", send: F4 }
  #显示系统信息
  eisu_toggle_system_info_board: { icon: "info.circle", label: "系统信息", send: Eisu_toggle, select: _system_info_board }
  #用户与反馈
  eisu_toggle_user_feedback: { icon: "ant.circle", label: "报Bug", send: Eisu_toggle, select: _user_feedback_board }

  #Mode_switch
  #开关
  #中英切换
  mode_switch_cn_or_en: { toggle: ascii_mode, send: Mode_switch, states: [ 中文, 西文 ], name: Mode_switch }
  #剪切板监控
  mode_switch_pasteboard_monitoring_on_or_off: { icon: "arrow.triangle.2.circlepath.doc.on.clipboard", toggle: app_setting/pasteboard_monitoring_switch, send: Mode_switch, states: [ 剪切板监控关, 剪切板监控开 ], select: bim, name: Mode_switch }
  #启动显示系统信息
  mode_switch_system_info_on_or_off: { icon: "info.circle", toggle: app_setting/show_system_info, send: Mode_switch, states: [ 系统信息关, 系统信息开 ], select: bim, name: Mode_switch }

  #mask
  left: { label: " ", send: Left }
  right: { label: " ", send: Right }
  shift: { send: Shift_L }
  shift_l: { send: Shift_L }
  return: { send: Return }
  confirm: { send: Return, label: "确认", name: confirm }
  backspace: { send: BackSpace }
  space: { label: " ", send: space }

  send_3: { label: "", send: 3 }
  send_2: { label: "", send: 2 }
  send_dot: { label: ".", send: . }
  send_equal: {label: "=", send: "="}
  #分词
  participle: { label: 分词, send: "'" }
  #分号
  send_semicolon: { label: ";", send: ";" }

  select_second: { label: "次选", send: 2 }
  select_third: { label: "三选", send: 3 }
  #换行
  next: { label: "换行", commit: "\\n" }

  #eisu_toggle_schem
  eisu_toggle_schema_en: { label: "ABC", send: Eisu_toggle, select: easy_en, option: schema }
  eisu_toggle_schema_default: { label: "ABC", send: Eisu_toggle, select: .default, option: schema }

  #eisu_toggle
  eisu_toggle_123_number: { label: 123, send: Eisu_toggle, select: number }
  eisu_toggle_123_number_sm_md: { label: 123, send: Eisu_toggle, select: number_sm_md }

  #  eisu_toggle_ABC_english: {label: "ABC", send: Eisu_toggle, select: english}
#  eisu_toggle_ABC_english: { label: "英", send: Eisu_toggle, select: english }
  eisu_toggle_ABC_english: { label: "中/英", send: Eisu_toggle, select: english}
  eisu_toggle_ABC_english_sm_md: { label: "中/英", send: Eisu_toggle, select: english_sm_md }
  eisu_toggle_ABC_english_schema_easy_en: { label: "中/英", text: "{eisu_toggle_ABC_english}{eisu_toggle_schema_en}" }

  eisu_toggle_符_symbols: { label: "符", send: Eisu_toggle, select: symbols }
  eisu_toggle_符_symbols_sm_md: { label: "符", send: Eisu_toggle, select: symbols_sm_md }
  eisu_toggle_符_dotsymbols: { label: "符", send: Eisu_toggle, select: .symbols }

  eisu_toggle_更多_dotSymbols: { label: "更多", send: Eisu_toggle, select: .symbols } #默认的符号键盘
  eisu_toggle_more_Symbols_no_functional: { label: "更多", send: Eisu_toggle, select: .symbols, functional: false } #默认的符号键盘
  eisu_toggle_更多_symbols: { label: "更多", send: Eisu_toggle, select: symbols } #默认的符号键盘
  eisu_toggle_123_dotNumber: { label: 123, send: Eisu_toggle, select: .number } #默认的9宫格数据键盘
  eisu_toggle_中_default: { label: 中, send: Eisu_toggle, select: default }
  eisu_toggle_返回_default: { label: 返回, send: Eisu_toggle, select: default }
  eisu_toggle_返回_default_sm_md: { label: 返回, send: Eisu_toggle, select: default_sm_md }
  eisu_toggle_返回_default_schema_default: {label: 返回, text: "{eisu_toggle_返回_default}{eisu_toggle_schema_default}"}
  eisu_toggle_en_zh_default_schema_default: { label: "英/中", text: "{eisu_toggle_返回_default}{eisu_toggle_schema_default}" }
  eisu_toggle_en_zh_default_sm_md_schema_default: { label: "英/中", text: "{eisu_toggle_返回_default_sm_md}{eisu_toggle_schema_default}" }
  eisu_toggle_返回_default_sm_md_schema_default: { label: 返回, text: "{eisu_toggle_返回_default_sm_md}{eisu_toggle_schema_default}" }
  eisu_toggle_default: { send: Eisu_toggle, select: default }
  #  eisu_toggle_ABC_default: {label: "ABC", send: Eisu_toggle, select: default}
  eisu_toggle_ABC_default: { label: "英", send: Eisu_toggle, select: default }

  #text

  text_delimiter: { label: "分隔", text: "{'}", name: delimiter }
  # .
  commit_halfperiod: { label: ".", commit: "." } #直接上屏半角句号
  text_halfperiod_default: { label: ".", text: ".{eisu_toggle_default}" } #上屏全角句号再跳转到default键盘
  text_fullperiod_default: { label: "。", text: "。{eisu_toggle_default}" } #上屏全角句号再跳转到default键盘
  text_full_period_default_no_functional: { label: "。", text: "。{eisu_toggle_default}", functional: false } #上屏全角句号再跳转到default键盘
  # ⋯
  text_fullellipsis_default: { label: "⋯⋯", text: "⋯⋯{eisu_toggle_default}" }
  text_halfellipsis_default: { label: "⋯", text: "⋯{eisu_toggle_default}" }
  text_halfunderellipsis_default: { label: "…", text: "…{eisu_toggle_default}" }
  # .
  text_halfperiod: { label: ".", text: "{.}", name: white_back } #上屏全角句号再跳转到default键盘
  # ,
  text_halfcomma: { label: "，", text: "{,}", name: white_back }
  text_halfcomma_default: { label: ",", text: ",{eisu_toggle_default}" }
  text_fullcomma_default: { label: "，", text: "，{eisu_toggle_default}" }
  text_full_comma_default_no_functional: { label: "，", text: "，{eisu_toggle_default}", functional: false }
  #  、
  text_fullcomma2_default: { label: "、", text: "、{eisu_toggle_default}" }
  text_fulldun_default: { label: "、", text: "、{eisu_toggle_default}" }
  # ?
  text_fullquestionmark_default: { label: "？", text: "？{eisu_toggle_default}" }
  text_full_question_mark_default_no_functional: { label: "？", text: "？{eisu_toggle_default}", functional: false }
  text_halfquestionmark_default: { label: "?", text: "?{eisu_toggle_default}" }
  text_halfdownquestionmark_default: { label: "¿", text: "¿{eisu_toggle_default}" }
  # !
  text_fullpoint_default: { label: "！", text: "！{eisu_toggle_default}" }
  text_full_point_default_no_functional: { label: "！", text: "！{eisu_toggle_default}", functional: false }
  text_halfpoint_default: { label: "!", text: "!{eisu_toggle_default}" }
  text_halfdownpoint_default: { label: "¡", text: "¡{eisu_toggle_default}" }
  # ;
  text_halfsemicolon_default: { label: "；", text: ";{eisu_toggle_default}" } #先上屏；再跳转到default键盘
  text_half_semicolon_default_no_functional: { label: "；", text: ";{eisu_toggle_default}", functional: false } #先上屏；再跳转到default键盘
  text_fullsemicolon_default: { label: "；", text: "；{eisu_toggle_default}" } #先上屏；再跳转到default键盘
  ##括号
  # （）()［］【】｛｝〈〉《》
  # ()
  text_fullbracket_left_default: { label: "(", text: "（）{Left}{eisu_toggle_default}" } #先上屏()光标往左移动一格再跳转到default键盘
  text_full_bracket_left_default_no_functional: { label: "(", text: "（）{Left}{eisu_toggle_default}", functional: false } #先上屏()光标往左移动一格再跳转到default键盘
  text_fullbracketclose_left: { label: ")", text: "）{Left}" } #先上屏()光标往左移动一格
  text_full_bracket_close_left_no_functional: { label: ")", text: "）{Left}", functional: false } #先上屏()光标往左移动一格
  # ()
  text_halfbracket_left_default: { label: "(", text: "(){Left}{eisu_toggle_default}" } #先上屏()光标往左移动一格再跳转到default键盘
  text_halfbracket_left: { label: "(", text: "(){Left}" } #先上屏()光标往左移动一格
  text_halfbracket_default: { label: ")", text: "){eisu_toggle_default}" } #先上屏)再跳转到default键盘
  # ［］
  text_fullsquarebracketleft2_left_default: { label: "［", text: "［］{Left}{eisu_toggle_default}" }
  text_fullsquarebracketright2_default: { label: "］", text: "］{eisu_toggle_default}" }
  # 【】
  text_fullsquarebracketleft_left_default: { label: "【", text: "【】{Left}{eisu_toggle_default}" }
  text_fullsquarebracketright_default: { label: "】", text: "】{eisu_toggle_default}" }
  #｛｝
  text_fullbrace_left_default: { label: "{", text: "｛｝{left}{eisu_toggle_default}" }
  text_fullrightbrace_default: { label: "}", text: "｝{eisu_toggle_default}" }
  text_halfleftbrace_default: { label: "{", text: "{{eisu_toggle_default}" }
  text_halfrightbrace_default: { label: "}", text: "}{eisu_toggle_default}" }
  # 〈〉
  text_fullsinglechineseguillemet_left_default: { label: "<", text: "〈〉{Left}{eisu_toggle_default}" }
  text_fullrightsinglechineseguillemet_default: { label: ">", text: "〉{eisu_toggle_default}" }
  #《》
  text_fullchineseguillemet_default: { label: "《", text: "《》{Left}{eisu_toggle_default}" }
  text_fullleftchineseguillemet_default: { label: "《", text: "《{eisu_toggle_default}" }
  text_fullrightchineseguillemet_default: { label: "》", text: "》{eisu_toggle_default}" }
  ##
  #引号 “”""＂＂「」『』
