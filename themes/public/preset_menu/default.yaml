# 预定义菜单配置文件
# 本文件定义了输入法中的各种菜单项及其行为

preset_menu:
  # 默认菜单 - 显示在输入法底部的快捷工具栏
  default_menu:
    menu: { events: [
     function_common_open_vip,    # vip
     function_common_speech_recognition, #
     eisu_toggle_emoji,           # 显示emoji表情选择器
     eisu_toggle_clip_board,      # 打开剪切板
     eisu_toggle_clear_quick_panel,   # 清除文本相关操作
     eisu_toggle_cut_quick_panel,      # 剪切操作
     eisu_toggle_status_bar_board,         # 状态栏
    ] }
  
  # 符号菜单 - 特殊符号选择器
  symbol_menu:
    menu: { events: [ 
     # 各种标点符号和特殊字符
     text_full_period,              # 句号
     text_full_question_mark,       # 问号
     text_full_point,               # 点
     text_half_ellipsis,            # 省略号
     text_half_bracket_left,        # 左括号
     text_half_bracket_right,       # 右括号
     text_full_semicolon,           # 分号
     text_full_dun,                 # 顿号
     text_full_tilde,               # 波浪号
     text_full_colon,               # 冒号
     text_full_square_bracket_left, # 左方括号
     text_full_square_bracket_right, # 右方括号
     text_full_smile,               # 笑脸表情
     text_full_comma,               # 逗号
     text_half_pound_sign,          # 井号
     text_half_colon,               # 半角冒号
     "%",                                  # 百分号
     "-",                                  # 连字符
     "+",                                  # 加号
     "×",                                  # 乘号
     "=" ] }                               # 等号
  
  # 完整功能菜单 - preset_keys L107-L628 中注释含「鸿蒙」支持的键（仅 iOS 已排除）
  all_menu:
    menu: { events: [
     function_common_speech_recognition,            # 语音识别
     function_keyboard_switch_cn_en,                # 中英键盘切换（动态显示目标态）
     function_keyboard_showInputMethodList,         # 系统输入法切换列表
     function_common_check_update,                  # 检查软件更新（有更新带红点）
     eisu_toggle_clear_quick_panel,                 # 清除文本相关操作
     eisu_toggle_cut_quick_panel,                   # 剪切操作
     eisu_toggle_schema_board,                      # 键盘方案选择
     function_keyboard_switchTheme_handwriting_large, # 手写键盘
     function_handwriting_find,                     # 手写找字
     eisu_toggle_theme_list_board,                  # 主题
     function_keyboard_rebuildTheme,                # 刷新主题
     eisu_toggle_edit_keyboard_board,               # 键盘调节
     eisu_toggle_one_hand_board,                    # 单手模式
     eisu_toggle_sound_board,                       # 声音设置
     eisu_toggle_common_setting_board,              # 通用设置
     eisu_toggle_common_setting_switches,           # 通用开关宫格
     commonsetting_toggle_show_comment,             # 逐码显示
     commonsetting_toggle_show_preedit,             # 编码显示
     commonsetting_toggle_text_preview_supported,   # 嵌入编码
     commonsetting_toggle_show_space_schema_name,   # 空格键显示方案名
     commonsetting_toggle_shift_single_tap_locked,  # Shift 单击锁定
     commonsetting_toggle_stroke_gesture_filter_enabled, # 笔画手势筛选
     commonsetting_toggle_keyboard_handwriting_filter_enabled, # 键盘手写
     commonsetting_toggle_candidate_handwriting_find_enabled, # 候选栏手写查字
     commonsetting_toggle_english_auto_space,       # 英文选词自动空格
     commonsetting_toggle_english_auto_capitalize,  # 英文句首自动大写
     commonsetting_toggle_uppercase_direct_commit,  # 大写字母直接上屏
     commonsetting_toggle_swipe_up_enabled,         # 上滑
     commonsetting_toggle_swipe_down_enabled,       # 下滑
     commonsetting_toggle_swipe_left_enabled,       # 左滑
     commonsetting_toggle_swipe_right_enabled,      # 右滑
     commonsetting_toggle_show_key_upper_label,     # 显示上滑符
     commonsetting_toggle_show_key_upper_label_with_functional, # 功能键显示上滑符
     commonsetting_toggle_show_key_down_label,      # 显示下滑符
     commonsetting_toggle_show_key_down_label_in_landscape, # 横屏显示下滑符
     commonsetting_toggle_show_key_down_label_with_functional, # 功能键显示下滑符
     commonsetting_toggle_has_moving_preedit,       # 滑动选择编码
     eisu_toggle_toolbar_customize,                 # 定制工具栏
     eisu_toggle_haptic_board,                      # 触感（设置页）
     eisu_toggle_custom_phrase_board,               # 常用语
     eisu_toggle_patch_board,                       # 补丁管理
     eisu_toggle_status_bar_board,                  # 方案状态栏
     eisu_toggle_setting,                           # 主菜单
     #下面是补丁
     eisu_toggle_fuzzy_pinyin,                      # 模糊拼音设置
     eisu_toggle_patch_predict,                     # 联想补丁
     eisu_toggle_patch_candidate,                   # 候选栏配置
     eisu_toggle_patch_keyboard,                    # 键盘配置补丁
    #下面是剪切板
     eisu_toggle_cut_setting,      # 剪切操作
     eisu_toggle_clear_setting,   # 清除文本相关操作
     eisu_toggle_clip_board,                        # 剪切板
    #  eisu_toggle_search_clip_board,               # 剪切板搜索
     eisu_toggle_pasteboard_setting_board,          # 剪切板设置
     eisu_toggle_pasteboard_favorite_board,         # 剪切板收藏
     eisu_toggle_file_manager,                      # 文件管理
     eisu_toggle_haptics_board,                     # 触感（独立面板）
     eisu_toggle_emoji,                             # 表情符号选择器
     eisu_toggle_switcher,                          # 切换（F4）
     function_keyboard_reuseLastInput,              # 重用上次输入
     function_keyboard_clearAll,                    # 清空输入
     function_keyboard_undo,                        # 撤销
     function_keyboard_deleteLeft,                  # 左删除
     function_keyboard_deleteRight,                 # 右删除
     function_keyboard_clearLeft,                   # 左清空
     function_keyboard_clearRight,                  # 右清空
     function_keyboard_redo,                        # 重做
     function_keyboard_selectAllCut,                # 全选后剪切
     function_keyboard_selectAllCopy,               # 全选后复制
     function_keyboard_selectAll,                   # 全选
     function_keyboard_cut,                         # 剪切
     function_keyboard_copy,                        # 复制
     function_keyboard_paste,                       # 粘贴
     function_keyboard_newline,                     # 换行
     function_rime_switcher,                        # Rime 方案开关
     function_rime_deploy,                          # 重新部署 Rime（全方案）
     function_rime_deploy_schema,                   # 部署当前方案
     function_rime_clear,                           # 重输 / 清空候选
     function_common_open_host,                     # 打开主机应用（更多设置）
     left_arrow,                                    # 光标左移
     right_arrow,                                   # 光标右移
     select_second,                                 # 次选（上屏 2）
     select_third,                                  # 三选（上屏 3）
     eisu_toggle_number,                            # 数字键盘 number
     eisu_toggle_ABC_english,                       # 中/英 → english
     eisu_toggle_符_dotsymbols                      # 符号键盘
    ] }
