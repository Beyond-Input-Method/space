    #c: 。
    #l: 。⋯…⋯⋯
    - { click: text_full_period_default_no_functional, long_click: [ text_fullperiod_default, text_halfellipsis_default, text_halfunderellipsis_default, text_fullellipsis_default ] }
    - { width: 2 }
    - { click: backspace, width: 13, name: backspace, swipe_up: function_keyboard_clearLeft, swipe_down: function_keyboard_undo}
    #4
    - { click: eisu_toggle_返回_default_schema_default, width: 13, name: default }
