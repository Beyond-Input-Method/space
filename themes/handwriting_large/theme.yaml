    - { click: 9, long_click: [ "9", "九", "玖", "９", "⑨", "⑼", "⒐", "❾", "㊈", "㈨" ] }
    - { click: 0, long_click: [ "0", "零", "０", "⓪", "°" ] }
    #0
    - { click: '%', label: '%' }
    - { click: '&', label: '&' }
    - { click: ',', label: ',' }
    - { click: '……', label: '……' }
    - { click: '「', label: '「' }
    - { click: '」', label: '」' }
    - { click: '\', label: '\' }
    - { click: '[', label: '[' }
    - { click: ']', label: ']' }
    - { click: '￥', label: '￥' }
    - { width: 5 }
    #2

    #c:~
    - { click: commit_half_tilde_no_functional, long_click: [ "～", "~" ] }
    - { click: "/", long_click: [ "/", "／", "|", "｜", "＼", "\\" ] }
    - { click: ":", long_click: [ "：'", ":" ] }
    #;
    - { click: text_half_semicolon_default_no_functional, long_click: [ text_halfsemicolon_default, text_fullsemicolon_default ] }
    #c:(
    #l:（）()［］【】｛｝〈〉《》
    - { click: text_full_bracket_left_default_no_functional, long_click: [ text_fullbracket_left_default, text_halfbracket_left_default, text_fullsquarebracketleft2_left_default, text_fullsquarebracketleft_left_default, text_fullbrace_left_default, text_fullsinglechineseguillemet_left_default, text_fullchineseguillemet_default ] }
