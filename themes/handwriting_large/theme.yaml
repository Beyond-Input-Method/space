
# default settings
# encoding: utf-8

style:
  __include: ./../public/style/default:/style
preset_styles:
  __include: ./../public/preset_styles/default:/preset_styles
preset_candidates:
  __include: ./../public/preset_candidates/default:/preset_candidates
preset_fonts:
  __include: ./../public/preset_fonts/default:/preset_fonts
preset_color_schemes:
  __include: ./../public/preset_color_schemes/default:/preset_color_schemes
preset_keys:
  __include: ./../public/preset_keys/default:/preset_keys
#键盘布局
preset_keyboards:
  default:
    ascii_mode: 0
    height: 46
    height_land: 34
    horizontal_gap: 6
    vertical_gap: 10
    vertical_gap_land: 4
    round_corner: 6
    key_text_offset_x: 0
    key_text_offset_y: 4
    key_press_text_offset_x: 0
    key_press_text_offset_y: 0
    key_upper_press_text_offset_x: 0
    key_upper_press_text_offset_y: 0
    key_upper_text_offset_x: 0
    key_upper_text_offset_y: 5
    key_down_text_offset_x: 0
    key_down_text_offset_y: -1
    key_down_press_text_offset_x: 0
    key_down_press_text_offset_y: 0
    preview_round_corner: 9
    long_preview_round_corner: 9
    long_preview_padding: 0
    long_preview_margin: 4
    preview: false
    shadow: { radius: 0.1, offsetX: 0, offsetY: 1.2, color: "#90949C" }
    #现在只支持配置click,swipe_up,swipe_down键盘
    keys:
    - { custom_key: handwriting, width: 86, height: 219, height_land: 149, name: handwriting_pad }
    - { click: backspace, width: 14, height: 50, name: backspace, swipe_up: function_keyboard_clearLeft, swipe_down: function_keyboard_undo}
    # # #2
    - { width: 86 }
    # - { click: [ { send: next, when: normal }, { send: function_rime_clear, when: composing }, { send: function_candidate_select_first, when: predicting }, { send: function_keyboard_paste, when: pasting }, { send: function_keyboard_copy, when: selecting } ], height: 50, long_click: [ function_keyboard_selectAll, function_keyboard_cut, function_keyboard_copy, function_keyboard_paste ], name: dot, width: 14 }
    - { collection: [ "，", "。", "？", "！", "、", "；", "：", "@", "…", "~", "'" ], width: 14, height: 164, height_land: 111, row_height: 39, row_height_land: 35, row_vertical_gap: 3, show_row_back_image: false, name: table }
    ## #3
    - { width: 100 }
    - { width: 100 }
    #4
    - { click: eisu_toggle_符_symbols, width: 14, name: symbol, preview: false, height_land: 36 }
    - __include: ./../public/preset_keyboards/bottom_func_keys:/bottom_number_key
      width: 13
      name: number
      preview: false
      height_land: 36
    - { click: space, width: 38, name: space, swipe_up: select_second, preview: false, height_land: 36 }
    - __include: ./../public/preset_keyboards/bottom_func_keys:/bottom_english_key
      width: 11
      name: english
      preview: false
      height_land: 36
    - { click: return, width: 24, name: return, swipe_up: select_third, composing: confirm, long_click: [function_keyboard_clearAll, function_keyboard_clearLeft, function_keyboard_clearRight,  function_keyboard_undo, function_keyboard_redo, next], rect_preview: true, preview: false, height_land: 36 }
    width: 10

  english:
    ascii_mode: 1
    lock: true
    name: english_keyboard
    keys:
    #0
    - { click: 1, label: 1 }
    - { click: 2, label: 2 }
    - { click: 3, label: 3 }
    - { click: 4, label: 4 }
    - { click: 5, label: 5 }
    - { click: 6, label: 6 }
    - { click: 7, label: 7 }
    - { click: 8, label: 8 }
    - { click: 9, label: 9 }
    - { click: 0, label: 0 }
    #1
    - { click: q, swipe_up: commit_1, long_click: [ Q, 1, q ] }
    - { click: w, swipe_up: commit_2, long_click: [ W, 2, w ] }
    - { click: e, swipe_up: commit_3, long_click: [ E, 3, e ] }
    - { click: r, swipe_up: commit_4, long_click: [ R, 4, r ] }
    - { click: t, swipe_up: commit_5, long_click: [ T, 5, t ] }
    - { click: y, swipe_up: commit_6, long_click: [ Y, 6, y ] }
    - { click: u, swipe_up: commit_7, long_click: [ U, 7, u ] }
    - { click: i, swipe_up: commit_8, long_click: [ I, 9, I ] }
    - { click: o, swipe_up: commit_9, long_click: [ O, 9, o ] }
    - { click: p, swipe_up: commit_0, long_click: [ P, 0, p ] }
    - { width: 5 }
    #2
    - { click: a, swipe_up: "~", long_click: [ A, "~", a ] }
    - { click: s, swipe_up: "/", long_click: [ S, "/", s ] }
    - { click: d, swipe_up: ":", long_click: [ D, ":", d ] }
    - { click: f, swipe_up: ";", long_click: [ F, ";", f ] }
    - { click: g, swipe_up: text_halfbracket_left, long_click: [ "(", G, g ] }
    - { click: h, swipe_up: ")", long_click: [ H, ")", h ] }
    - { click: j, swipe_up: "@", long_click: [ J, "@", j ] }
    - { click: k, swipe_up: commit_halfbackslash, long_click: [ K, "\"", k ] }
    - { click: l, swipe_up: "”", long_click: [ L, "”", l ] }
    - { width: 5 }
    #3
    - { click: shift, width: 13, name: shift }
    - { width: 2 }
    - { click: z, swipe_up: "-", long_click: [ Z, "-", z ] }
    - { click: x, swipe_up: "_", long_click: [ X, "_", x ] }
    - { click: c, swipe_up: "#", long_click: [ C, "#", c ] }
    - { click: v, swipe_up: "?", long_click: [ V, "?", v ] }
    - { click: b, swipe_up: "!", long_click: [ B, "!", b ] }
    - { click: n, swipe_up: ",", long_click: [ N, ",", n ] }
    - { click: m, swipe_up: ".", long_click: [ M, ".", m ] }
    - { width: 2 }
    - { click: backspace, width: 13, name: backspace, swipe_up: function_keyboard_clearLeft, swipe_down: function_keyboard_undo}
    #4
    - { click: eisu_toggle_符_symbols, width: 14, name: symbol }
    - { click: eisu_toggle_123_number, width: 10, name: number }
    - { click: send_dot, width: 10 }
    - { click: space, width: 31, name: space }
    #- {click: eisu_toggle_返回_default, width: 11, name: english}
    - { click: eisu_toggle_返回_default_schema_default, width: 11, name: english, preview: false }
    - { click: return, width: 24, name: return, composing: confirm, long_click: [function_keyboard_clearAll, function_keyboard_clearLeft, function_keyboard_clearRight,  function_keyboard_undo, function_keyboard_redo, next] }

  number:
    #。？！…（））；、～:[]ï`#：+*/×
    __include: ./../public/preset_menu/default:/preset_menu/symbol_menu
    ascii_mode: 1
    name: number_keyboard
    preview: false
    height: 60
    height_land: 44
    vertical_gap_land: 4
    width: 22
    keys:
    #1
    # - {width: 1}
    - { collection: ["+", "-", "×", "/", "%", "=", ",", "#", "?", ".", ":", "*" ], width: 17, height: 205, height_land: 140, row_height: 50, row_height_land: 34, row_vertical_gap: 3, show_row_back_image: false, name: table }
    - { click: 1, height: 64 }
    - { click: 2, height: 64 }
    - { click: 3, height: 64 }
    - { click: backspace, width: 17, height: 64, name: backspace, swipe_up: function_keyboard_clearLeft, swipe_down: function_keyboard_undo}

    # # #2
    - { width: 17 }
    - { click: 4, height: 64 }
    - { click: 5, height: 64 }
    - { click: 6, height: 64 }
    - { click: send_dot, width: 17, height: 64, name: dot }

    - { width: 17 }
    - { click: 7, height: 64 }
    - { click: 8, height: 64 }
    - { click: 9, height: 64 }
    - { click: commit_halfat, width: 17, height: 64, name: halfat }

    # - {width: 1}
    - { click: eisu_toggle_符_dotsymbols, width: 17, height: 60, name: default }
    - { click: eisu_toggle_返回_default, width: 22, height: 60 }
    - { click: commit_0, height: 60 }
    - { click: space, name: space, height: 60 }
    - { click: return, name: return, width: 17, height: 60, composing: confirm, long_click: [function_keyboard_clearAll, function_keyboard_clearLeft, function_keyboard_clearRight,  function_keyboard_undo, function_keyboard_redo, next] }

  symbols:
