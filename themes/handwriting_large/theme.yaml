    #c:@
    - { click: text_halfat_default_no_functional, long_click: [ text_halfat_default, text_halfcaret_default ] }
    #c:“”
    #l:“”""＂＂「」『』
    - { click: text_full_quotation_mark_left_default_no_functional, long_click: [ text_fullquotationmark_left_default, text_halfquotationmark_left_default, text_fullquotationmark2_left_default, text_fullcornerquotes_left_default, text_fulldoublequote_left_default ] }
    #c:”
    #l:”"＂」』
    - { click: text_full_quotation_mark_right_default_no_functional, long_click: [ text_fullquotationmarkright_default, text_halfquotationmarkclose_default, text_fullquotationmarkright2_default, text_fullcornerquotesdown_default, text_fulldoublequoteleft_default ] }
    - { width: 5 }
    #3
    - { click: eisu_toggle_更多_dotSymbols, width: 13, name: symbol, long_click: [ "" ] }
    - { width: 2 }
    #c: -
    #l: -—•+=
    - { click: "-", long_click: [ "-", "—", text_halfmiddledot_default, text_halfplus_default, text_halfequal_default ] }
    #c: _
    #l: _＿
