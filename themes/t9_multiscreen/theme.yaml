preset_color_schemes:
  __include: ./../public/preset_color_schemes/default:/preset_color_schemes
  #各类键盘的宽度和高度定义
  # base_width：标准键宽,一般指字母键键宽
  # func_left_width：指功能键的键宽
  # line_blank_width：分体键盘中间留空宽度
  # blank_left_width：键位数量不足，用空补足#
  # edge_width：使键盘左右不紧贴屏边缘，留一定的空白
  # space_width：空格宽度
preset_height_width:
  # 键盘行高度调整，除部分较矮的屏高外，均采用base高度
  base_height: &base_h 46
  number_collection_base_height: &number_collection_base_h 150  #数字键盘滚动列的高度（3个base+2个hgapheight的高度
  number_row_height: &number_row_h 37.5
  number_row_vertical_gap: &number_row_vertical_gap 3
  horizontal_gap_base_height: &horizontal_gap_base_h 6  #按键横向距离
  vertical_gap_base_height: &vertical_gap_base_h 6  #按键纵向距离
  vertical_gap_land_base_height: &vertical_gap_land_base_h 6
  sm_base_height: &sm_base_h 35  #小屏高的按键高度
  sm_number_collection_base_height: &sm_number_collection_base_h 111
  sm_number_row_height: &sm_number_row_h 37.5
  sm_number_row_vertical_gap: &sm_number_row_vertical_gap 3
  sm_horizontal_gap_base_height: &sm_horizontal_gap_base_h 3
  sm_vertical_gap_base_height: &sm_vertical_gap_base_h 3
  sm_vertical_gap_land_base_height: &sm_vertical_gap_land_base_h 3
