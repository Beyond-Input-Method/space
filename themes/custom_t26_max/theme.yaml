  default:
    name: default
    ascii_mode: 0
    height: 46
    width: 10
    height_land: 46
    horizontal_gap: 6
    vertical_gap: 6
    vertical_gap_land: 6
    round_corner: 6
    key_text_size: 19
    key_upper_text_size: 10
    key_down_text_size: 8
    key_text_offset_x: 0
    key_text_offset_y: 4
    key_press_text_offset_x: 0
    key_press_text_offset_y: 0
    key_upper_press_text_offset_x: 0
    key_upper_press_text_offset_y: 0
    key_upper_text_offset_x: 0
    key_upper_text_offset_y: 3
    key_down_text_offset_x: 0
    key_down_text_offset_y: -1
    key_down_press_text_offset_x: 0
    key_down_press_text_offset_y: 0
    preview_round_corner: 9
    long_preview_round_corner: 9
    long_preview_padding: 0
    long_preview_margin: 4
    preview: true
    shadow: { radius: 0.1, offsetX: 0, offsetY: 1.2, color: "#90949C" }
    keys:
   #第1行
    - {click: q, label: Q, swipe_up: commit_1, swipe_down: "一", long_click: [commit_1, commit_Q, commit_q] }
    - {click: w, label: W, swipe_up: commit_2, swipe_down: "二", long_click: [commit_2, commit_W, commit_w] }
    - {click: e, label: E, swipe_up: commit_3, swipe_down: "三", long_click: [commit_3, commit_E, commit_e] }
    - {click: r, label: R, swipe_up: commit_4, swipe_down: "四", long_click: [commit_4, commit_R, commit_r] }
    - {click: t, label: T, swipe_up: commit_5, swipe_down: "五", long_click: [commit_5, commit_T, commit_t] }
    - {click: y, label: Y, swipe_up: commit_6, swipe_down: "六", long_click: [commit_6, commit_Y, commit_y] }
    - {click: u, label: U, swipe_up: commit_7, swipe_down: "七", long_click: [commit_7, commit_U, commit_u] }
    - {click: i, label: I, swipe_up: commit_8, swipe_down: "八", long_click: [commit_8, commit_I, commit_i] }
    - {click: o, label: O, swipe_up: commit_9, swipe_down: "九", long_click: [commit_9, commit_O, commit_o] }
    - {click: p, label: P, swipe_up: commit_0, swipe_down: "〇", long_click: [commit_0, commit_P, commit_p] }
 #第2行
    - {width: 5 }
    - {click: a, label: A, swipe_up: function_keyboard_selectAll, long_click: [function_keyboard_selectAll, commit_A] }
    - {click: s, label: S, swipe_up: text_halfcaret_default, swipe_down: text_fullellipsis_default, long_click: [text_halfcaret_default, commit_S, commit_s] }
    - {click: d, label: D, swipe_up: commit_fullcolon, swipe_down: commit_halfcolon, long_click: [commit_fullcolon, commit_D, commit_d] }
    - {click: f, label: F, swipe_up: commit_halfsemicolon, swipe_down: ";", long_click: [commit_halfsemicolon, commit_F, commit_f] }
    - {click: g, label: G, swipe_up: text_halfbracket, swipe_down: text_fullquotationmark_left, long_click: [text_halfbracket, commit_G, commit_g] }
    - {click: h, label: H, swipe_up: commit_halfpoundsign, swipe_down: commit_halfpoundsign, long_click: [commit_halfpoundsign, commit_H, commit_h] }
    - {click: j, label: J, swipe_up: commit_halfat, swipe_down: "@", long_click: [commit_halfat, commit_J, commit_j] }
    - {click: k, label: K, swipe_up: commit_halfunderline, swipe_down: commit_halfdash, long_click: [commit_halfunderline, commit_K, commit_k] }
    - {click: l, label: L, swipe_up: commit_fullquestionmark, swipe_down: commit_fullquestionmark, long_click: [commit_fullquestionmark, commit_L, commit_l] }
    - {width: 5 }
 #第3行
    - {click: shift, swipe_up: eisu_toggle_ABC_english_schema_easy_en, has_menu: text_delimiter, width: 15, name: shift, preview: false }
    - {click: z, label: Z, swipe_up: "~", swipe_down: send_grave, long_click: ["~", commit_Z, commit_z] }
    - {click: x, label: X, swipe_up: function_keyboard_cut, long_click: [function_keyboard_cut, commit_X, commit_x] }
    - {click: c, label: C, swipe_up: function_keyboard_copy, long_click: [function_keyboard_copy, commit_C, commit_c] }
    - {click: v, label: V, swipe_up: function_keyboard_paste, long_click: [function_keyboard_paste, commit_V, commit_v] }
    - {click: b, label: B, swipe_up: commit_fullexclamationpoint, swipe_down: "!", long_click: [commit_fullexclamationpoint, commit_B, commit_b] }
    - {click: n, label: N, swipe_up: commit_halfslash, swipe_down: "/", long_click: [commit_halfslash, commit_N, commit_n] }
    - {click: m, label: M, swipe_up: text_halfpercent_default, swipe_down: send_equal, long_click: [text_halfpercent_default, commit_M, commit_m] }
    - {click: backspace, swipe_up: eisu_toggle_clear_setting2, width: 15, name: backspace, preview: false }
 #第4行
    - {click: eisu_toggle_123_number, swipe_up: eisu_toggle_符_symbols, width: 18, name: symbol, preview: false }
    - {click: send_dot2, swipe_up: "$", swipe_down: commit_half_dot, width: 10, preview: false }
    - {click: space, width: 44, name: space, preview: false }
    - {click: send_comma, swipe_up: "&", swipe_down: commit_half_comma, width: 10, preview: false }
    - {click: return, width: 18, name: return, composing: confirm, long_click: next, rect_preview: true, preview: false }
