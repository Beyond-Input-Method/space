name: 清脆触感
english_name: Crisp
description: 干脆利落、中等强度的触感方案，提供清晰的按键反馈
version: 1.0
create_date: 2025-11-19

特点:
  - 中等强度振动（50-75%）
  - 干脆利落的反馈
  - 清晰的按键确认
  - 日常使用最佳选择

技术参数:
  默认按键:
    类型: 瞬态振动
    强度: 55%
    频率: 60Hz
    延时: 0ms
  
  回车键:
    类型: 双击效果
    强度: 75% + 45%
    频率: 65Hz + 60Hz
    延时: 0ms
  
  删除键:
    类型: 连续振动
    强度: 60%
    频率: 58Hz
    持续时间: 30ms
    延时: 0ms
  
  空格键:
    类型: 瞬态振动
    强度: 50%
    频率: 62Hz
    延时: 0ms

适用场景:
  - 日常打字
  - 办公环境
  - 一般文本输入
  - 聊天通讯

推荐用户:
  - 普通用户
  - 办公人员
  - 追求平衡体验的用户
