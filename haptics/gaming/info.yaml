name: 游戏触感
english_name: Gaming
description: 电竞级快速响应触感，提供极致的游戏输入体验
version: 1.0
create_date: 2025-11-19

特点:
  - 高频高强度（68-95%）
  - 极速响应
  - 电竞级反馈
  - 三连击效果

技术参数:
  默认按键:
    类型: 瞬态振动
    强度: 72%
    频率: 68Hz
    延时: 0ms
  
  回车键:
    类型: 三连击效果
    强度: 95% + 60% + 35%
    频率: 70Hz + 68Hz + 65Hz
    延时: 0ms
  
  删除键:
    类型: 连续振动
    强度: 78%
    频率: 66Hz
    持续时间: 32ms
    延时: 0ms
  
  空格键:
    类型: 瞬态振动
    强度: 75%
    频率: 69Hz
    延时: 0ms

适用场景:
  - 游戏输入
  - 竞技场景
  - 快速响应需求
  - 电竞应用

推荐用户:
  - 游戏玩家
  - 电竞选手
  - 追求极致响应的用户
  - 年轻用户群体
