name: 弹性触感
english_name: Bouncy
description: 模拟弹簧回弹效果，提供富有弹性和趣味性的触感体验
version: 1.0
create_date: 2025-11-19

特点:
  - 弹性回弹效果
  - 多次振幅变化
  - 趣味性强
  - 独特的触感曲线

技术参数:
  默认按键:
    类型: 弹性连续振动
    强度: 50%
    频率: 55Hz
    持续时间: 40ms
    曲线点数: 5
    延时: 0ms
  
  回车键:
    类型: 多次回弹
    强度: 70%
    频率: 55Hz
    持续时间: 60ms
    曲线点数: 6
    延时: 0ms
  
  删除键:
    类型: 连续振动
    强度: 55%
    频率: 53Hz
    持续时间: 45ms
    曲线点数: 5
    延时: 0ms
  
  空格键:
    类型: 连续振动
    强度: 58%
    频率: 54Hz
    持续时间: 42ms
    曲线点数: 5
    延时: 0ms

适用场景:
  - 游戏化应用
  - 趣味输入
  - 儿童应用
  - 娱乐场景

推荐用户:
  - 追求趣味性的用户
  - 游戏玩家
  - 年轻用户群体
