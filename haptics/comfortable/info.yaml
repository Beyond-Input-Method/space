name: 舒适触感
english_name: Comfortable
description: 舒适柔和的触感设计，适合长时间使用，减少疲劳
version: 1.0
create_date: 2025-11-19

特点:
  - 柔和舒适
  - 中低强度（38-52%）
  - 减少疲劳
  - 长时间使用友好

技术参数:
  默认按键:
    类型: 连续振动
    强度: 38%
    频率: 52Hz
    持续时间: 32ms
    延时: 0ms
  
  回车键:
    类型: 连续振动
    强度: 52%
    频率: 54Hz
    持续时间: 48ms
    延时: 0ms
  
  删除键:
    类型: 连续振动
    强度: 42%
    频率: 50Hz
    持续时间: 38ms
    延时: 0ms
  
  空格键:
    类型: 连续振动
    强度: 40%
    频率: 51Hz
    持续时间: 35ms
    延时: 0ms

适用场景:
  - 长时间打字
  - 文档编辑
  - 学习工作
  - 舒适优先

推荐用户:
  - 长时间打字用户
  - 学生、作家
  - 追求舒适的用户
  - 对疲劳敏感的用户
