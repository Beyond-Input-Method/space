name: 机械键盘触感
english_name: Mechanical
description: 模拟机械键盘的双段触感，提供专业的打字体验
version: 1.0
create_date: 2025-11-19

特点:
  - 双段式触感设计
  - 模拟机械轴体
  - 专业打字手感
  - 清晰的段落感

技术参数:
  默认按键:
    类型: 双段瞬态振动
    强度: 65% + 35%
    频率: 55Hz + 50Hz
    延时: 0ms
  
  回车键:
    类型: 三段触感
    强度: 85% + 50% + 30%
    频率: 55Hz + 52Hz + 48Hz
    延时: 0ms
  
  删除键:
    类型: 连续振动
    强度: 70%
    频率: 53Hz
    持续时间: 40ms
    延时: 0ms
  
  空格键:
    类型: 双段瞬态振动
    强度: 70% + 40%
    频率: 55Hz + 50Hz
    延时: 0ms

适用场景:
  - 专业打字
  - 编程开发
  - 长文档编辑
  - 追求手感体验

推荐用户:
  - 机械键盘爱好者
  - 程序员
  - 专业打字员
  - 追求打字手感的用户
