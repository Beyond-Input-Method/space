name: 现代简约触感
english_name: Modern
description: 简洁现代的触感设计，提供平衡的打字体验
version: 1.0
create_date: 2025-11-19

特点:
  - 简洁设计
  - 平衡的触感强度
  - 现代化体验
  - 适应性强

技术参数:
  默认按键:
    类型: 瞬态振动
    强度: 45%
    频率: 58Hz
    延时: 0ms
  
  回车键:
    类型: 连续振动
    强度: 65%
    频率: 60Hz
    持续时间: 35ms
    延时: 0ms
  
  删除键:
    类型: 瞬态振动
    强度: 50%
    频率: 56Hz
    延时: 0ms
  
  空格键:
    类型: 瞬态振动
    强度: 42%
    频率: 57Hz
    延时: 0ms

适用场景:
  - 现代 UI 设计
  - 日常使用
  - 多场景适配
  - 简约风格应用

推荐用户:
  - 极简主义用户
  - 现代设计爱好者
  - 追求简洁体验的用户
