name: 打字机触感
english_name: Typewriter
description: 模拟经典打字机的机械冲击感，带来怀旧的打字体验
version: 1.0
create_date: 2025-11-19

特点:
  - 机械冲击感
  - 怀旧打字体验
  - 渐进式振动曲线
  - 独特的触感风格

技术参数:
  默认按键:
    类型: 冲击式连续振动
    强度: 60%
    频率: 45Hz
    持续时间: 25ms
    延时: 0ms
  
  回车键:
    类型: 长冲击 + 回弹
    强度: 80% + 45%
    频率: 42Hz + 40Hz
    持续时间: 45ms
    延时: 0ms
  
  删除键:
    类型: 连续振动
    强度: 65%
    频率: 43Hz
    持续时间: 35ms
    延时: 0ms
  
  空格键:
    类型: 连续振动
    强度: 70%
    频率: 44Hz
    持续时间: 30ms
    延时: 0ms

适用场景:
  - 创意写作
  - 怀旧体验
  - 特殊场景
  - 个性化需求

推荐用户:
  - 怀旧用户
  - 作家、创作者
  - 追求独特体验的用户
