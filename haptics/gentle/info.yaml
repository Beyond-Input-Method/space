name: 轻柔触感
english_name: Gentle
description: 柔和、低强度的触感方案，适合长时间打字和安静环境使用
version: 1.0
create_date: 2025-11-19

特点:
  - 低强度振动（25-40%）
  - 柔和的触感反馈
  - 减少疲劳感
  - 适合夜间使用

技术参数:
  默认按键:
    类型: 瞬态振动
    强度: 25%
    频率: 50Hz
    延时: 0ms
  
  回车键:
    类型: 双击效果
    强度: 40% + 20%
    频率: 55Hz + 50Hz
    延时: 0ms
  
  删除键:
    类型: 连续振动
    强度: 30%
    频率: 48Hz
    持续时间: 35ms
    延时: 0ms
  
  空格键:
    类型: 瞬态振动
    强度: 28%
    频率: 52Hz
    延时: 0ms

适用场景:
  - 夜间使用
  - 安静环境
  - 长文本输入
  - 减少打扰

推荐用户:
  - 需要长时间打字的用户
  - 对振动敏感的用户
  - 追求舒适体验的用户
