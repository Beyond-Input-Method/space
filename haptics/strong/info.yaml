name: 强劲有力触感
english_name: Strong
description: 高强度触感方案，提供明显的按键反馈，适合嘈杂环境
version: 1.0
create_date: 2025-11-19

特点:
  - 高强度振动（80-100%）
  - 明显的触感反馈
  - 适合嘈杂环境
  - 强烈的确认感

技术参数:
  默认按键:
    类型: 瞬态振动
    强度: 80%
    频率: 55Hz
    延时: 0ms
  
  回车键:
    类型: 瞬态 + 连续振动
    强度: 100% + 70%
    频率: 55Hz + 52Hz
    持续时间: 40ms
    延时: 0ms
  
  删除键:
    类型: 连续振动
    强度: 85%
    频率: 53Hz
    持续时间: 45ms
    延时: 0ms
  
  空格键:
    类型: 瞬态振动
    强度: 85%
    频率: 55Hz
    延时: 0ms

适用场景:
  - 嘈杂环境
  - 户外使用
  - 需要明确反馈
  - 运动场景

推荐用户:
  - 需要强反馈的用户
  - 户外工作者
  - 嘈杂环境使用者
