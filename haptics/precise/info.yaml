name: 精准触感
english_name: Precise
description: 精确快速的触感反馈，提供专业级的打字体验
version: 1.0
create_date: 2025-11-19

特点:
  - 高频振动（60-65Hz）
  - 快速响应
  - 精确反馈
  - 专业感强

技术参数:
  默认按键:
    类型: 瞬态振动
    强度: 60%
    频率: 62Hz
    延时: 0ms
  
  回车键:
    类型: 双击效果
    强度: 80% + 50%
    频率: 65Hz + 62Hz
    延时: 0ms
  
  删除键:
    类型: 连续振动
    强度: 65%
    频率: 60Hz
    持续时间: 28ms
    延时: 0ms
  
  空格键:
    类型: 瞬态振动
    强度: 58%
    频率: 61Hz
    延时: 0ms

适用场景:
  - 专业打字
  - 编程开发
  - 需要精确反馈
  - 高效输入

推荐用户:
  - 专业打字员
  - 程序员
  - 追求效率的用户
  - 需要精确反馈的用户
