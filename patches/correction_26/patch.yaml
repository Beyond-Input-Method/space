patch_to: "{$current_schema}"

patch:
  - title: "拼音26键自动纠错"
    key: "enable_correction_26"
    description: "仅支持 26 键拼音方案开启自动纠错，其他方案开启无效"
    patch_to: "{$current_schema}"
    bind_control: "enable_correction_26"
    patch:
      translator/enable_correction: true

controls:
  stringsTable: "Root"
  preferences:
    - type: group
      title: 拼音26键纠错
      footer_text: 仅支持 26 键拼音，其他方案开启无效
    - type: toggle_switch
      title: 启用拼音 26 键自动纠错
      key: enable_correction_26
      default_value: true
      toggle_style: switch
