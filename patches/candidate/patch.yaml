# 联想

# 注意：
# 所有路径都是相对路径。就是相对space下面的目录。比如:schemas, themes, sounds, haptics, fonts, patches, plugins等。

# 给指定文件打补丁
# 提供下面几个目录变量,都是绝对路径
# 1,当前选择方案目录：{$current_schema_dir}, 当前选择的方案：{$current_schema}
# 例如：{$current_schema_dir} = /xx/space/schemas/bim-t9
# 例如：{$current_schema} = /xx/space/schemas/bim-t9/bim-t9.yaml
# 2,当前选择主题目录：{$current_theme_dir}, 当前选择的主题：{$current_theme}
# 例如：{$current_theme_dir} = /xx/space/themes/default
# 例如：{$current_theme} = /xx/space/themes/default/theme.yaml
# 3,当前选择音效目录：{$current_sound_dir}, 当前选择的音效: {$current_sound}
# 例如：{$current_sound_dir} = /xx/space/sounds/default
# 例如：{$current_sound} = /xx/space/sounds/default/sound.yaml
# 4,当前选择触感目录：{$current_haptic_dir}, 当前选择的触感: {$current_haptic}
# 例如：{$current_haptic_dir} = /xx/space/haptics/default
# 例如：{$current_haptic} = /xx/space/haptics/default/haptic.yaml
# 5,当前选择字体目录：{$current_font_dir}, 当前选择的字体: {$current_font}
# 例如：{$current_font_dir} = /xx/space/fonts/default
# 例如：{$current_font} = /xx/space/fonts/default/font.yaml


# 这里全局资源的.
# resources:
#  #复制文件到指定文件,支持目录和文件
#      #源文件, 这里的路径相对于patch的目录下。也就是patches目录下的predict目录下。
#    - source: "res/predict.db"
#      #目标文件,{}里面是变量,指方案目录或者主题目录
#      target: "schames/{$current_schema_dir}/predict.db"

# 这里是给当前选择的方案打补丁, 补丁文件是predict.db, 所以在当前选择的方案目录下，并把res/predict.db文件复制到当前选择的方案目录下。
# 如果要给当前选择的方案目录的default.yaml文件打补丁就是：
# patch_to_file: "schemas/{$current_schema_dir}/default.yaml"
# 也可以给当前选择的主题目录的theme.yaml文件打补丁就是：
# patch_to_file: "themes/{$current_theme_dir}/theme.yaml"
# 其它也类似

#全局
patch_to: "{$current_theme}"
patch:
  # 这里可以打多个补丁，每个补丁是一个对象.
  # title是补丁的标题，
  # key是唯一标识, 
  # description是补丁的描述。
  # patch是补丁的配置。
  # resource是补丁的资源。
  # patch_to是补丁的目标文件。比如/xxx/wubi86.custom.yaml, 当然也可以是方案目录或者主题目录。
  - title: "字体"
    key: "candidate_font"
    description: "修改候选栏字体"
    bind_control: "candidate_font"
    # 这里最好在pc上测试过了，再放到进来
    patch:
        "preset_fonts/default/candidate_text_size": "{$candidate_text_size}"
        "preset_fonts/default/comment_text_size": "{$comment_text_size}"
        "preset_candidates/default/candidate_view_height": "{$candidate_view_height}"
        "preset_candidates/default/use_cursor": "{$candidate_use_cursor}"
# 配置项列表，包含所有的设置选项
controls:
  stringsTable: "Root"
  # ==================== 基本设置 ====================
  # 分组标题，用于将相关设置归类显示
  preferences:
    - type: group                    # 控件类型：分组标题
      title: 字体设置             # 显示标题：在界面上显示的文字
      footer_text: 配置字体大小  # 底部说明：显示在分组下方的解释文字
    # 开关控件，用于开启或关闭功能
    - type: toggle_switch            # 控件类型：开关按钮
      title: 启用候选字体                # 显示标题：在界面上显示的文字
      key: candidate_font                # 配置键名：用于保存和读取设置值的唯一标识
      default_value: false            # 默认值：首次使用时的初始设置
      toggle_style: switch           # 开关样式：switch=滑动开关，checkmark=勾选框
    # 滑块控件，用于选择数值范围
    - type: slider                   # 控件类型：滑块
      title: 候选字体                # 显示标题：在界面上显示的文字
      key: candidate_text_size            # 配置键名：用于保存和读取设置值的唯一标识
      default_value: 22               # 默认值：滑块的初始位置值
      minimum_value: 8               # 最小值：滑块左端的数值
      maximum_value: 38              # 最大值：滑块右端的数值
      step: 1                        # 步长：每次滑动的最小增减量
    - type: toggle_switch            # 控件类型：开关按钮
      title: 高亮候选项                # 显示标题：在界面上显示的文字
      key: candidate_use_cursor                # 配置键名：用于保存和读取设置值的唯一标识
      default_value: true             # 默认值：首次使用时的初始设置
      toggle_style: switch           # 开关样式：switch=滑动开关，checkmark=勾选框
    # 滑块控件，用于选择数值范围
    - type: slider                   # 控件类型：滑块
      title: 逐码提示字体                # 显示标题：在界面上显示的文字
      key: comment_text_size            # 配置键名：用于保存和读取设置值的唯一标识
      default_value: 12               # 默认值：滑块的初始位置值
      minimum_value: 4               # 最小值：滑块左端的数值
      maximum_value: 18              # 最大值：滑块右端的数值
      step: 1                        # 步长：每次滑动的最小增减量
    - type: group                    # 控件类型：分组标题
      title: 候选栏设置             # 显示标题：在界面上显示的文字
      footer_text: 配置候选栏高度  # 底部说明：显示在分组下方的解释文字
    # 滑块控件，用于选择数值范围
    - type: slider                   # 控件类型：滑块
      title: 候选栏高度                # 显示标题：在界面上显示的文字
      key: candidate_view_height            # 配置键名：用于保存和读取设置值的唯一标识
      default_value: 51              # 默认值：滑块的初始位置值
      minimum_value: 30               # 最小值：滑块左端的数值
      maximum_value: 84             # 最大值：滑块右端的数值
      step: 1                        # 步长：每次滑动的最小增减量