patch_to: "{$file:speech:volcengine}"
patch:
  - title: "标点展示"
    key: "speech_punctuation_patch"
    description: "配置语音识别的标点符号展示方式"
    patch_to: "{$file:speech:volcengine}"
    bind_control: "enable_punctuation"
    patch:
      enablePunc: true
      puncMode: "{$punctuation_mode}"

  - title: "口水词去除"
    key: "speech_filler_filter_patch"
    description: "自动去除语音识别中的语气词和口头禅"
    patch_to: "{$file:speech:volcengine}"
    bind_control: "enable_filler_filter"
    patch:
      enableFilterFiller: true

  - title: "繁体中文输出"
    key: "speech_output_zh_variant_patch"
    description: "将语音识别结果转换为所选繁体中文变体"
    patch_to: "{$file:speech:volcengine}"
    bind_control: "enable_output_zh_variant"
    patch:
      outputZhVariant: "{$output_zh_variant}"

  - title: "语种及方言识别"
    key: "speech_language_identification_patch"
    description: "识别中英文及支持的中文方言，并在 additions 中返回语种或场景标签"
    patch_to: "{$file:speech:volcengine}"
    bind_control: "enable_lid"
    patch:
      enableLid: true

  - title: "语义顺滑"
    key: "speech_semantic_smoothing_patch"
    description: "删除或修正识别结果中的停顿词、语气词和语义重复，让文本更连贯"
    patch_to: "{$file:speech:volcengine}"
    bind_control: "enable_ddc"
    patch:
      enableDdc: true
  

  - title: "语音指令总开关"
    key: "speech_auto_send_patch"
    description: "开启后，下方各触发词指令生效"
    patch_to: "{$file:speech:volcengine}"
    bind_control: "enable_auto_send"
    patch:
      enableAutoSend: true

  - title: "触发词：over over → 发送"
    key: "speech_cmd_over_patch"
    description: "说'over over'时自动发送当前输入内容"
    patch_to: "{$file:speech:volcengine}"
    bind_control: "enable_cmd_over"
    patch:
      enableCmdOver: true

  - title: "触发词：发送发送 → 发送"
    key: "speech_cmd_send_patch"
    description: "说'发送发送'时自动发送当前输入内容"
    patch_to: "{$file:speech:volcengine}"
    bind_control: "enable_cmd_send"
    patch:
      enableCmdSend: true

  - title: "触发词：取消取消 → 取消"
    key: "speech_cmd_cancel_patch"
    description: "说'取消取消'时丢弃当前语音并退出"
    patch_to: "{$file:speech:volcengine}"
    bind_control: "enable_cmd_cancel"
    patch:
      enableCmdCancel: true

  - title: "触发词：算了算了 → 取消"
    key: "speech_cmd_suanle_patch"
    description: "说'算了算了'时丢弃当前语音并退出"
    patch_to: "{$file:speech:volcengine}"
    bind_control: "enable_cmd_suanle"
    patch:
      enableCmdSuanle: true

controls:
  stringsTable: "Root"
  preferences:
    - type: group
      title: "标点配置"

    # 总开关
    - type: toggle_switch
      title: "启用标点展示"
      key: enable_punctuation
      default_value: false
      toggle_style: switch

    - type: multi_value
      title: "标点符号模式"
      key: punctuation_mode
      default_value: "1"
      values:
        - "1"
        - "2"
        - "3"
      titles:
        - "智能添加标点"
        - "空格代替标点"
        - "句末不加标点"

    - type: group
      title: "口水词去除"
      footer_text: "去除语音中的口水词，如'嗯'、'啊'等"
    # 总开关
    - type: toggle_switch
      title: "启用口水词去除"
      key: enable_filler_filter
      default_value: false
      toggle_style: switch

    - type: group
      title: "繁体中文输出"
      footer_text: "开启后，将识别结果转换为所选繁体中文变体。"

    - type: toggle_switch
      title: "启用繁体中文输出"
      key: enable_output_zh_variant
      default_value: false
      toggle_style: switch

    - type: multi_value
      title: "繁体中文类型"
      key: output_zh_variant
      default_value: "traditional"
      values:
        - "traditional"
        - "tw"
        - "hk"
      titles:
        - "大陆繁体"
        - "台湾正体"
        - "香港繁体"

    - type: group
      title: "语种及方言识别"
      footer_text: "支持中文、英文、上海话、闽南话、四川话、陕西话和粤语；识别标签由服务端返回到 additions。"

    - type: toggle_switch
      title: "启用语种及方言识别"
      key: enable_lid
      default_value: true
      toggle_style: switch

    - type: group
      title: "语义顺滑"
      footer_text: "开启后，系统会删除或修正停顿词、语气词和语义重复，让识别文本更连贯。默认关闭。"

    - type: toggle_switch
      title: "启用语义顺滑"
      key: enable_ddc
      default_value: false
      toggle_style: switch

    - type: group
      title: "语音指令"
      footer_text: "说出触发词可自动发送或取消。各触发词可单独开关，均为双写以降低误触发。"
    # 总开关
    - type: toggle_switch
      title: "启用语音指令"
      key: enable_auto_send
      default_value: false
      toggle_style: switch

    # 各触发词独立开关（在"启用语音指令"开启后生效）
    - type: toggle_switch
      title: "over over → 发送"
      key: enable_cmd_over
      default_value: true
      toggle_style: switch

    - type: toggle_switch
      title: "发送发送 → 发送"
      key: enable_cmd_send
      default_value: true
      toggle_style: switch

    - type: toggle_switch
      title: "取消取消 → 取消"
      key: enable_cmd_cancel
      default_value: true
      toggle_style: switch

    - type: toggle_switch
      title: "算了算了 → 取消"
      key: enable_cmd_suanle
      default_value: true
      toggle_style: switch
