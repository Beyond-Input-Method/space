patch_to: "{$file:speech:volcengine}"
patch:
  - title: "标点展示"
    key: "speech_punctuation_patch"
    description: "配置语音识别的标点符号展示方式"
    patch_to: "{$file:speech:volcengine}"
    bind_control: "enable_punctuation"
    patch:
      enablePunc: true
      puncMode: "{$punctuation_mode}"

  - title: "口水词去除"
    key: "speech_filler_filter_patch"
    description: "自动去除语音识别中的语气词和口头禅"
    patch_to: "{$file:speech:volcengine}"
    bind_control: "enable_filler_filter"
    patch:
      enableFilterFiller: true
  

  - title: "over,over自动发送"
    key: "speech_auto_send_patch"
    description: "检测到连续说'over,over'时自动发送当前输入内容"
    patch_to: "{$file:speech:volcengine}"
    bind_control: "enable_auto_send"
    patch:
      enableAutoSend: true
      triggerPhrase: "over,over"

controls:
  stringsTable: "Root"
  preferences:
    - type: group
      title: "标点配置"

    # 总开关
    - type: toggle_switch
      title: "启用标点展示"
      key: enable_punctuation
      default_value: false
      toggle_style: switch

    - type: multi_value
      title: "标点符号模式"
      key: punctuation_mode
      default_value: "1"
      values:
        - "1"
        - "2"
        - "3"
      titles:
        - "智能添加标点"
        - "空格代替标点"
        - "句末不加标点"

    - type: group
      title: "口水词去除"
      footer_text: "去除语音中的口水词，如'嗯'、'啊'等"
    # 总开关
    - type: toggle_switch
      title: "启用口水词去除"
      key: enable_filler_filter
      default_value: false
      toggle_style: switch

    - type: group
      title: "自动发送"
      footer_text: "检测到'over,over'时自动发送消息"
    # 总开关
    - type: toggle_switch
      title: "启用over,over自动发送"
      key: enable_auto_send
      default_value: false
      toggle_style: switch