# 📅 日期时间补丁配置
# 
# 这个补丁为输入法添加日期时间功能，让你可以快速输入当前日期、时间、星期和农历
# 
# 🔧 系统变量说明
# 系统提供以下内置变量，用于指向当前选择的配置目录：
# 
# 📁 方案相关：
#   {$current_schema_dir}  - 当前输入方案目录（如：/space/schemas/五笔86）
#   {$current_schema}      - 当前输入方案文件（如：/space/schemas/五笔86/wubi86.yaml）
# 
# 🎨 主题相关：
#   {$current_theme_dir}   - 当前主题目录（如：/space/themes/默认主题）
#   {$current_theme}       - 当前主题文件（如：/space/themes/默认主题/theme.yaml）
# 
# 🔊 音效相关：
#   {$current_sound_dir}   - 当前音效目录（如：/space/sounds/默认音效）
#   {$current_sound}       - 当前音效文件（如：/space/sounds/默认音效/sound.yaml）
# 
# 📳 触感相关：
#   {$current_haptic_dir}  - 当前触感目录（如：/space/haptics/默认触感）
#   {$current_haptic}      - 当前触感文件（如：/space/haptics/默认触感/haptic.yaml）
# 
# 🔤 字体相关：
#   {$current_font_dir}    - 当前字体目录（如：/space/fonts/默认字体）
#   {$current_font}        - 当前字体文件（如：/space/fonts/默认字体/font.yaml）
# 
# 🌐 其他配置：
#   {$current_space_dir}   - 空间根目录（如：/space）
#   {$current_plugin_dir}  - 插件目录（如：/space/plugins）
#   {$current_dict_dir}    - 词库目录（如：/space/dicts）
#   {$current_speech_dir}  - 语音目录（如：/space/speeches）
#   {$current_patch_dir}   - 补丁目录（如：/space/patches）

# 🎯 补丁应用目标
patch_to: "{$current_schema}"

# 📦 补丁功能列表
patch:
  - title: "语言模型"
    key: "turn_on_grammar"
    description: "语言模型"
    bind_control: "turn_on_grammar"
    patch_to: "{$current_schema}"
    # ⚙️ 方案配置修改
    patch:
      grammar:
        language: wanxiang-lts-zh-hans
        collocation_max_length: "{$collocation_max_length}"
        collocation_min_length: "{$collocation_min_length}"
        collocation_penalty: "{$collocation_penalty}"
        non_collocation_penalty: "{$non_collocation_penalty}"
        weak_collocation_penalty: "{$weak_collocation_penalty}"
        rear_penalty: "{$rear_penalty}"
      "translator/contextual_suggestions": "{$contextual_suggestions}"
      "translator/contextual_group_by_type": "{$contextual_group_by_type}"
      "translator/max_homophones": "{$max_homophones}"
      "translator/max_homographs": "{$max_homographs}"

# 📱 控件UI配置
# 为用户提供友好的界面来调整语言模型的参数
controls:
  stringsTable: "Root"
  preferences:
    # ==================== 基本开关 ====================
    - type: group
      title: 基本设置
      footer_text: 开启或关闭语言模型功能(开启后，输入法将使用语言模型进行智能建议。配置请谨慎修改)
    
    - type: toggle_switch
      title: 启用语言模型
      key: turn_on_grammar
      default_value: false
      toggle_style: switch
    
    # ==================== 词组长度设置 ====================
    - type: group
      title: 词组长度配置
      footer_text: 控制语言模型识别的词组长度范围
    
    - type: slider
      title: 最长词组长度
      key: collocation_max_length
      default_value: 8
      minimum_value: 2
      maximum_value: 15
      step: 1
    
    - type: slider
      title: 最短词组长度
      key: collocation_min_length
      default_value: 2
      minimum_value: 2
      maximum_value: 5
      step: 1
    
    # ==================== 惩罚值设置 ====================
    - type: group
      title: 词组惩罚配置
      footer_text: 调整不同类型词组的选中概率(负值越大,概率越低)
    
    - type: slider
      title: 常见搭配惩罚
      key: collocation_penalty
      default_value: -6
      minimum_value: -30
      maximum_value: 0
      step: 1
    
    - type: slider
      title: 非搭配词组惩罚
      key: non_collocation_penalty
      default_value: -18
      minimum_value: -30
      maximum_value: 0
      step: 1
    
    - type: slider
      title: 弱搭配词组惩罚
      key: weak_collocation_penalty
      default_value: -24
      minimum_value: -30
      maximum_value: 0
      step: 1
    
    - type: slider
      title: 后续词语位置惩罚
      key: rear_penalty
      default_value: -18
      minimum_value: -30
      maximum_value: 0
      step: 1
    
    # ==================== 上下文建议设置 ====================
    - type: group
      title: 上下文建议配置
      footer_text: 控制输入法的智能建议功能
    
    - type: toggle_switch
      title: 启用上下文建议
      key: contextual_suggestions
      default_value: true
      toggle_style: switch
    
    - type: toggle_switch
      title: 按类型分组建议
      key: contextual_group_by_type
      default_value: false
      toggle_style: switch
    
    # ==================== 同音字/同形字设置 ====================
    - type: group
      title: 同音字与同形字配置
      footer_text: 控制显示的同音字和同形字数量
    
    - type: slider
      title: 最大同音字数量
      key: max_homophones
      default_value: 5
      minimum_value: 1
      maximum_value: 10
      step: 1
    
    - type: slider
      title: 最大同形字数量
      key: max_homographs
      default_value: 5
      minimum_value: 1
      maximum_value: 10
      step: 1