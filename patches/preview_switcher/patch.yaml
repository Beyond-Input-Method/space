patch_to: "{$current_theme}"
patch:
  - title: "键盘气泡开关"
    key: "keyboard_preview_enabled"
    description: "控制当前主题中默认键盘、英文键盘、符号键盘的按键气泡显示"
    patch_to: "{$current_theme}"
    bind_control: "keyboard_preview_enabled"
    patch:
      "preset_keyboards/default/preview": "{$default_keyboard_preview}"
      "preset_keyboards/english/preview": "{$english_keyboard_preview}"
      "preset_keyboards/symbols/preview": "{$symbols_keyboard_preview}"
controls:
  stringsTable: "Root"
  preferences:
    - type: group
      title: 键盘气泡设置
      footer_text: 先打开总开关，再分别设置默认键盘、英文键盘、符号键盘是否显示按键气泡
    - type: toggle_switch
      title: 启用键盘气泡功能
      key: keyboard_preview_enabled
      default_value: false
      toggle_style: switch
    - type: toggle_switch
      title: 默认键盘显示气泡
      key: default_keyboard_preview
      default_value: false
      toggle_style: switch
    - type: toggle_switch
      title: 英文键盘显示气泡
      key: english_keyboard_preview
      default_value: true
      toggle_style: switch
    - type: toggle_switch
      title: 符号键盘显示气泡
      key: symbols_keyboard_preview
      default_value: true
      toggle_style: switch
 

